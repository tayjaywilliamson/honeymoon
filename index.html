<script>
const DAYS = [
{ n:1, date:"Tue Nov 24", title:"Wheels Up", base:"Travel day", intro:["Tokyo was a fishing village called Edo until 1603, when Tokugawa Ieyasu made it the seat of his shogunate and it grew, within a century, into the largest city on earth. The emperor moved in from Kyoto in 1868 and the city was renamed Tōkyō, \"eastern capital.\" It has been flattened twice since, by the 1923 earthquake and the 1945 firebombing, which is why so little looks old and why the city feels like a hundred villages stitched together: each neighborhood rebuilt around its own station, with its own character. Roughly 14 million people live in the city proper and 37 million in the metro area, the biggest urban region in the world, and yet it runs quietly, cleanly, and almost exactly on time.", "You land at Haneda, Tokyo's original airport (1931), which sits on reclaimed land in the bay about 30 minutes from the center. For decades it handled only domestic flights while Narita took the international traffic; since 2010 it has steadily won the long-haul routes back, which is why you get to skip the 90-minute haul in from Narita. Terminal 3 is the international one, and its Edo Koji floor is designed to look like an Edo-period street, a nice first glimpse of the aesthetic you'll be living in for the next ten days."], flight:{
  out:"7:00 AM JL7235 Austin → Dallas, then JL11 Dallas → Tokyo Haneda. Premium Economy, about 17½ hours door to door. Conf. ANFCQ6.",
  land:"Haneda 3:25 PM Wednesday Nov 25.",
  before:"Suica in both phone wallets, offline maps downloaded, TRUNK expects a Nov 25 evening arrival (the Nov 24 night is cancelled).",
  inflight:"Set watches to Japan time at DFW. Eat the first meal, sleep the middle of the long leg (night in Japan), wake for the last 3–4 hours."}},

{ n:2, date:"Wed Nov 25", title:"Soft Landing", base:"TRUNK Hotel Yoyogi Park, Tomigaya", intro:["Your first neighborhood is Tomigaya, the quiet side of Shibuya ward that locals call Oku-Shibuya, \"back Shibuya.\" It's a residential pocket of low buildings, bakeries, record shops, and some of the best coffee in the city, a ten-minute walk from the chaos of Shibuya Crossing but a world away in pace. TRUNK sits at the edge of Yoyogi Park, which has one of the more unusual histories of any park in the world: it was an Imperial Army parade ground, then the \"Washington Heights\" housing estate for American officers during the postwar occupation, then the athletes' village for the 1964 Olympics, and only opened as a public park in 1967. The ginkgo and zelkova trees are now big enough that it feels ancient.", "Fuglen is an Oslo café that has been open since 1963 and chose Tomigaya for its first branch outside Norway in 2012. It's a small, real piece of the Tokyo coffee story: the city has had kissaten, slow-pour coffee houses, since the 1920s, and the current wave of Nordic and Australian-style roasters landed here first. By day it's filter coffee and Norwegian mid-century furniture (all of it for sale); after dark the same room turns into a cocktail bar. The cheese toast is the thing to order if you're hungry.", "Dinner is tonkatsu, a breaded, deep-fried pork cutlet that is one of Japan's great adopted dishes. Pork cutlets arrived with Western food in the Meiji era (Rengatei in Ginza claims the first one in 1899), and the dish became tonkatsu as we know it in Tokyo in the late 1920s, when cooks started cutting a thick loin into strips so it could be eaten with chopsticks and serving it with shredded cabbage and a thick, fruity sauce. Tsukiuma is a neighborhood place rather than a famous one, which is the point on a jet-lagged first night: a bowl of rice, miso soup, a crisp cutlet, and bed."], stops:[
  {name:"Haneda Airport, Terminal 3", q:"Haneda Airport Terminal 3", lat:35.5494, lon:139.7798, t:"3:25 PM", stay:"~1 hr", note:"Immigration and bags. Taxi or the limousine bus to Tomigaya, about 40 min.", leg:["taxi",40]},
  {name:"TRUNK Hotel Yoyogi Park", q:"TRUNK Hotel Yoyogi Park", lat:35.6676, lon:139.6922, t:"~5:45 PM", stay:"30 min", note:"Check in, shower, drop everything. The unused Nov 24 night was cancelled, so check-in is a normal Nov 25 arrival.", leg:["walk",2]},
  {name:"Fuglen Tokyo", q:"Fuglen Tokyo Tomigaya", lat:35.6674, lon:139.6912, t:"6:15 PM", stay:"45 min", note:"Coffee or a negroni two blocks away. You're in Japan.", near:"Little Nap Coffee Stand and Shibuya Publishing on the same lanes.", leg:["walk",6]},
  {name:"Tonkatsu Tsukiuma, Kamiyama-cho", q:"Tonkatsu Tsukiuma Kamiyamacho 12-3 Kamiyamacho Shibuya", lat:35.6652, lon:139.6938, t:"7:30 PM", stay:"1 hr", note:"Walk-in, no reservation: the Kamiyama-cho shop five minutes from TRUNK (12-3 Kamiyama-cho, Urban Kamiyama 1F). Thick-cut tonkatsu sets around ¥1,000–2,000, 26 seats, open daily 11:30 AM–10 PM (last order 9:30), cards and Suica accepted. Easy on a jet-lagged first night, and the late hours absorb any flight delay. If there's a line, Fu-unji tsukemen in Shinjuku is the backup.", leg:["walk",5]},
  {name:"TRUNK rooftop", q:"TRUNK Hotel Yoyogi Park", lat:35.6676, lon:139.6922, t:"9:30 PM", stay:"one drink", note:"First toast of the honeymoon over the skyline, then bed. Tsukiji at dawn tomorrow."}
]},

{ n:3, date:"Thu Nov 26", title:"The East Day", base:"TRUNK · Tsukiji, Asakusa, ginkgo lights, Isana", intro:["Tsukiji means \"constructed land\": the whole district was reclaimed from the bay after the great fire of 1657. The wholesale fish market moved here in 1935 after the 1923 earthquake destroyed the old market at Nihonbashi, and for 80 years it was the largest fish market in the world, the place the famous tuna auctions happened. The inner wholesale market moved to Toyosu in 2018, but the outer market (jōgai), the 400 or so shops and stalls that grew up around it selling knives, dried bonito, tamagoyaki, and breakfast sushi, stayed put and is busier than ever. Hamarikyu, a short walk south, is a Tokugawa shogun's seaside villa from the 1650s, with a tidal pond fed by Tokyo Bay and a teahouse on an island in the middle of it. It was the shoguns' duck-hunting ground, then an imperial detached palace, and has been a public garden since 1946; skyscrapers on three sides and a 300-year-old pine on the fourth.", "Asakusa is old Tokyo, or as close as the city gets. Sensō-ji is Tokyo's oldest temple: the story goes that in the year 628 two fisherman brothers pulled a small golden statue of Kannon, the bodhisattva of mercy, out of the Sumida River, and a temple was built to house it. Through the Edo period Asakusa was the city's entertainment district, with theaters, teahouses, and the licensed pleasure quarter of Yoshiwara just behind it, and the Nakamise shopping street leading to the temple has been selling snacks and souvenirs to pilgrims since the 1700s. The great red Kaminarimon (Thunder Gate) with its giant lantern and the main hall were both rebuilt after the 1945 bombing, but the atmosphere is intact: incense smoke, fortune-drawers, rickshaw pullers, and the five-story pagoda over everything.", "Kappabashi is a kilometer-long street between Asakusa and Ueno lined with about 170 shops that have supplied Tokyo's restaurants since around 1912: knives, lacquer bowls, bamboo steamers, ceramic plates by the stack, and the plastic food samples that sit in every restaurant window in Japan. It's where chefs shop, and the prices show it. Meiji Jingu Gaien's ginkgo avenue is the evening's reward: 146 ginkgo trees planted in 1923 along a 300-meter approach to the Meiji Memorial Picture Gallery, pruned into perfect cones and turning solid gold in the last week of November, when the lights come on under them. Isana is dinner: Edomae-style sushi, the Tokyo tradition of lightly curing, marinating, or aging each piece of fish rather than serving it plain, which began as a way to keep fish safe before refrigeration and became the whole art."], stops:[
  {name:"TRUNK, out the door", q:"TRUNK Hotel Yoyogi Park", lat:35.6676, lon:139.6922, t:"6:30 AM", stay:"", note:"Jet lag has you up anyway. Taxi straight across town; the market is best before 8.", leg:["taxi",25]},
  {name:"Tsukiji Outer Market", stamp:"Goshuin at Namiyoke Inari Shrine, on the market's corner; its office may not open until about 9, so catch it on the walk out if it's open.", q:"Tsukiji Outer Market", lat:35.6654, lon:139.7707, t:"7:00 AM", stay:"2 hrs", note:"Graze stall to stall: tamagoyaki, uni toast, tuna nigiri, strawberry daifuku. Jet lag is the superpower.", near:"Namiyoke Shrine at the market's corner.", leg:["walk",12]},
  {name:"Hamarikyu Gardens teahouse", stamp:"Free garden stamp at the entrance gate, as at most Tokyo metropolitan gardens.", q:"Hamarikyu Gardens", lat:35.6600, lon:139.7633, t:"9:00 AM", stay:"1 hr", note:"Matcha and wagashi in the 300-year-old pond teahouse, empty at opening.", leg:["taxi",20]},
  {name:"Benitsuru + Senso-ji", stamp:"Goshuin at Senso-ji's counter beside the main hall, and a second one at Asakusa Shrine right next door. Free eki stamp at Asakusa Station.", q:"Benitsuru Asakusa", lat:35.7125, lon:139.7955, t:"10:30 AM", stay:"2.5 hrs", note:"Sign the pancake waitlist, then Senso-ji, Nakamise and Imo Pippi's brûléed sweet potato while you wait.", near:"Fuglen Asakusa for coffee; Sumida riverbank Skytree views. If the pancake slots are gone: Pelican Cafe by Tawaramachi (the famous charcoal-toasted thick toast and fruit sandwiches, opens 9, short line), Sometaro (grill-your-own okonomiyaki in a 1937 tatami house near Kappabashi), Daikokuya (tendon since 1887, a line but it moves), or Onigiri Yadoroku, Tokyo's oldest onigiri shop.", leg:["walk",12]},
  {name:"Kappabashi Kitchen Town", q:"Kappabashi Dougu Street", lat:35.7137, lon:139.7889, t:"1:15 PM", stay:"75 min", note:"Knives at Kamata or Tsubaya (engraving available), ceramics, fake-food models.", leg:["train",40]},
  {name:"Hotel rest", q:"TRUNK Hotel Yoyogi Park", lat:35.6676, lon:139.6922, t:"2:45 PM", stay:"1 hr", note:"Ginza line to JR, then feet up before the lights.", leg:["train",25]},
  {name:"Meiji Jingu Gaien ginkgo avenue", q:"Meiji Jingu Gaien Ginkgo Avenue", lat:35.6745, lon:139.7175, t:"4:15 PM", stay:"to 6:15", note:"The 300 m golden avenue as the lights come on (4:30–7:30 PM). Leave by 6:15.", near:"Aoyama's boutiques line the walk out.", leg:["taxi",15]},
  {name:"Isana Sushi Bar (booked)", q:"Isana Sushi Bar Azabu-Juban", lat:35.6555, lon:139.7360, t:"7:00 PM", stay:"2 hrs", note:"Condé Nast's intimate Azabu omakase, counter for two at 7:00, booked through Pocket Concierge. Check the confirmation email carries the tree-nut note.", near:"Azabu-Juban's old shopping street; Gen Yamamoto's 8-seat cocktail omakase is 5 min away if you want a nightcap.", leg:["taxi",15]},
  {name:"TRUNK", q:"TRUNK Hotel Yoyogi Park", lat:35.6676, lon:139.6922, t:"9:30 PM", stay:"", note:"Early night. Meiji Shrine at 7:45 tomorrow."}
]},

{ n:4, date:"Fri Nov 27", title:"Meiji Dawn, Ginza, Sumo", base:"TRUNK · Meiji Shrine, Ginza, sumo in Asakusa", intro:["Meiji Jingū is the shrine to Emperor Meiji and Empress Shōken, the couple who presided over Japan's transformation from a closed feudal country into a modern power between 1868 and 1912. It was finished in 1920, and the 170-acre forest around it was planted by hand with 100,000 trees donated from every prefecture, designed by foresters to look after itself for centuries; it's now one of the richest ecosystems in the city. The great torii gates are made from 1,500-year-old Taiwanese cypress, the walls of sake barrels are offerings from brewers across Japan, and if you're lucky on a weekday morning you'll see a Shinto wedding procession cross the courtyard under a red umbrella. The buildings were destroyed in 1945 and rebuilt in 1958; the forest survived.", "Ginza takes its name from the silver mint (gin-za) the Tokugawa set up here in 1612. After a fire in 1872 the government rebuilt it as a showpiece \"Bricktown\" of Western-style buildings, gas lamps, and willow-lined sidewalks, and it became Japan's first modern shopping street and the place Tokyoites went to see and be seen; \"Ginbura,\" strolling Ginza, entered the language in the 1920s. The flagships you're visiting tell the story in miniature: Kyūkyodō has sold incense, brushes, and paper since 1663 in Kyoto and 1880 here; Itoya has been the city's stationery temple since 1904; Dover Street Market, UNIQLO's twelve-floor global flagship, and the Onitsuka Tiger store are the modern chapter. Hanayama's udon is from Gunma prefecture, the mountain country north of Tokyo that grows the wheat, and the lunchtime line is part of the Ginza ritual.", "Sumo is Japan's national sport and the oldest one still practiced, with roots in Shinto harvest rituals that go back more than a thousand years; the ring is still purified with salt and the referee still dresses as a priest. Professional sumo settled in Edo in the 1700s, and three of the six annual tournaments are held at the Kokugikan in Ryōgoku, just across the river from Asakusa, where most of the training stables are. Tonight's show is run by retired wrestlers, which is the only way to see the sport up close in November, when there's no tournament: you'll see the ring-entering ceremony, the stomping and salt-throwing, real bouts, and the chance to step into the ring. Ahiru Store afterward is Tomigaya's beloved natural-wine bar, standing room, baked bread, and a crowd that has been there since 6."], note:"The sumo show is booked for 6:00 in Asakusa and TRUNK to Asakusa is about 40 minutes by taxi, so leave the hotel by 5:10. Ginza shops open late (Itoya 10, Ginza Six 10:30, Uniqlo and the resale shops 11), so the morning is udon line first, matcha after lunch. Harajuku moves to tomorrow, so the afternoon ends with a real rest before the show.", stops:[
  {name:"TRUNK, out the door", q:"TRUNK Hotel Yoyogi Park", lat:35.6676, lon:139.6922, t:"7:30 AM", stay:"", note:"Walk into Yoyogi Park and through to the shrine's forest; the park gate is two minutes from the hotel.", leg:["walk",12]},
  {name:"Meiji Shrine", stamp:"Goshuin at the shrine office by the main hall, and they sell goshuincho (seal books) here if you still need one. The office may open after your 7:45 arrival; if it's shut, Togo Shrine tomorrow is the backup.", q:"Meiji Jingu", lat:35.6764, lon:139.6993, t:"7:45 AM", stay:"1 hr", note:"The forested approach, misty and near-empty. Write ema wishes together.", near:"Exit toward Harajuku; Chiyoda line from Meiji-jingumae to Ginza is 25 min.", leg:["train",30]},
  {name:"Itoya and Kyukyodo", q:"Itoya Ginza", lat:35.6718, lon:139.7665, t:"9:30 AM", stay:"to 10:35", note:"Chiyoda line to Ginza. Kyukyodo (paper and incense since 1663) and Itoya both open at 10 and sit two minutes from the udon line, so browse here until it's time to queue. Before 10, a slow coffee at a Chuo-dori kissa fills the gap.", leg:["walk",3]},
  {name:"Godaime Hanayama Udon, Ginza", q:"Godaime Hanayama Udon Ginza", lat:35.6692, lon:139.7690, t:"10:40 AM", stay:"to ~11:50", note:"Behind Kabuki-za, 3-14-13 Ginza. No reservations: a ticket machine comes out about half an hour before the 11:00 opening and people are seated in ticket order, so being in line at 10:40 puts you in the first seating. Stay close once you have a ticket; it's a queue, not a pager. Oni Himokawa wide noodles with the duck or pork dipping broth. Skip the walnut dip.", leg:["walk",5]},
  {name:"Cloud Club Matcha", q:"Cloud Club Matcha Ginza", lat:35.6697, lon:139.7705, t:"12:00 PM", stay:"30 min", note:"Her hand-whisked matcha bar, three drinks, standing room, cashless. Four minutes from the udon shop; the morning line will have thinned by noon.", leg:["walk",8]},
  {name:"UNIQLO Ginza + Dover Street Market", q:"UNIQLO Ginza", lat:35.6701, lon:139.7636, t:"12:40 PM", stay:"50 min", note:"Both open at 11 and share the block. Twelve floors of Uniqlo (Japan-only collabs, UT floor, free alterations), then DSM Ginza's seven floors of Comme des Garçons and friends.", leg:["walk",3]},
  {name:"Onitsuka Tiger Ginza", q:"Onitsuka Tiger Ginza", lat:35.6715, lon:139.7652, t:"1:35 PM", stay:"40 min", note:"His and hers Mexico 66s with custom embroidery. Allow production time; collect before you leave Ginza.", leg:["walk",6]},
  {name:"Ginza resale and the flagships", q:"Komehyo Ginza", lat:35.6727, lon:139.7675, t:"2:20 PM", stay:"to 3:30", note:"Vintage here means bags, watches and jewelry. Komehyo Ginza (2-7-18, on Chuo-dori) is the one with archive fashion as well as Chanel, Hermès and Vuitton; Ms.Vintage (2-10-11, a minute from Higashi-Ginza) for vintage Hermès and Chanel; Brand World (8-10-8) for discontinued designer bags; LUXARIA (7-5-12) for Hermès archive pieces and high jewelry; COMMIT Ginza (1-7-16) and Premier Value Shop (7-4-15, 7F) for Rolex, Patek and AP. ReFa GINZA is here too for the Beautech dryer (tax-free; ask for the 100–240V version). Then the flagships: Seiko House in the Wako clock-tower building for Grand Seiko, Mikimoto for pearls, Ginza Natsuno for chopsticks, Ginza Six's rooftop garden and Tsutaya art books, and a depachika sweep at Mitsukoshi before you go.", leg:["taxi",25]},
  {name:"TRUNK rest", q:"TRUNK Hotel Yoyogi Park", lat:35.6676, lon:139.6922, t:"3:55 PM", stay:"75 min", note:"Feet up, change for the show. Taxi at 5:10; Asakusa is 40 minutes.", leg:["taxi",40]},
  {name:"Asakusa Sumo Club ANNEX (booked)", q:"Asakusa Sumo Club ANNEX", lat:35.7135, lon:139.7935, t:"6:00 PM", stay:"2 hrs", note:"Booked and paid: Tokyo Luxury Sumo Experience, Business Class for two, ¥60,000, ref ANX-106927129. Second-row seats with the same A5 wagyu sukiyaki, tempura and chanko (the stew sumo wrestlers eat) as First Class, a shorter drinks list, and retired pro wrestlers bouting in a real ring. The booking portal flagged missing booking information, so fill in the guest details (and the tree-nut note) before the day. 2-11-7 Asakusa, B1, 2 min from Tsukuba Express Asakusa; arrive by 5:45.", near:"One more glass nearby: Dochaku, a natural-wine standing bar 3 min from Asakusa Station (closed Thu), or Nov, a bistro with 70-odd natural wines (closed Wed).", leg:["taxi",30]},
  {name:"Ahiru Store, Tomigaya", q:"Ahiru Store Tomigaya", lat:35.6672, lon:139.6905, t:"8:45 PM", stay:"to close", note:"The ten-seat natural-wine bistro that started Tokyo's natural-wine wave, five minutes from TRUNK: duck sausage, warm bread, ¥900 glasses. Friday hours 6 to midnight, no reservations, and bar seats are hard to get, so if it's full walk three minutes to Sansan, an eight-seat counter of Japanese wines by Yoyogi-Hachiman Station. Either way you're home on foot."}
]},

{ n:5, date:"Sat Nov 28", title:"Harajuku, Shibuya, Ushigoro", base:"TRUNK · three neighbors, all within 15 minutes, bags go to Kyoto", intro:["Harajuku and Omotesandō grew up together as the front door to Meiji Shrine. Omotesandō, the wide avenue of zelkova trees, was laid out in 1920 as the shrine's ceremonial approach (the name means \"front approach road\") and after the war, with the Washington Heights housing next door, it became the neighborhood where young Tokyo first met American culture. Harajuku's Takeshita Street turned into the capital of teenage fashion in the 1980s and 90s, the birthplace of kawaii culture, Lolita and decora styles, and the street-fashion magazines that the world copied. Omotesandō itself went the other way and became Tokyo's Champs-Élysées, lined with flagship buildings by the best architects of the last 25 years: Herzog & de Meuron's Prada, Toyo Ito's Tod's, Tadao Andō's Omotesandō Hills. The Ōta Memorial Museum, tucked just off the avenue, holds 14,000 ukiyo-e woodblock prints from the collection of Ōta Seizō, the insurance executive who spent his life buying back the Hokusai, Hiroshige, and Utamaro prints that had flooded out of Japan in the 1800s; the exhibition changes every month.", "Cat Street is the Kyū-Shibuya-gawa Promenade, a winding lane built on top of the Shibuya River, which was covered over in the 1960s before the Olympics. It links Harajuku to Shibuya and is where the independent and vintage shops live, the Tokyo version of a flea-market street, with RAGTAG for designer resale and Koffee Mameya for beans. Sushi today is kaiten, conveyor-belt sushi, invented in Osaka in 1958 by a restaurant owner who got the idea from the bottling line at a beer factory; Onodera is the upscale end of it, a Ginza sushi house running a belt in Omotesandō.", "Shibuya is where Tokyo's youth culture lives now, and the scramble crossing outside the station, with up to 3,000 people crossing at every change of the lights, is probably the most photographed intersection on earth. Hachikō, the bronze dog at the corner, has waited there since 1934: the real Hachikō met his owner's train every evening, and kept coming for nine years after the professor died. Shibuya Sky is the open rooftop of the 229-meter Scramble Square tower, opened 2019, with the whole city, Tokyo Tower, and on a clear evening Mount Fuji. Yakiniku, tonight's dinner, is Japan's version of Korean barbecue: grilled at the table over charcoal, introduced by Korean residents after the war and refined in Tokyo into a cuisine of exact cuts of wagyu, served one slice at a time. Nonbei Yokochō, \"drunkard's alley,\" is two rows of tiny postwar bars squeezed against the train tracks, each seating six or eight; Golden Gai in Shinjuku is the same idea at ten times the scale."], note:"Hand the big bags to the front desk before you leave (takuhaibin to the Celestine, about ¥2,500 a bag, arrives Nov 30). Tomorrow is one overnight bag. Path has closed, so breakfast is Bondi or Camelback. Everything is on foot, one two-stop train, or a 10-minute taxi; dinner is in Aoyama, between the morning and the afternoon neighborhoods.", stops:[
  {name:"TRUNK, bags to the desk", q:"TRUNK Hotel Yoyogi Park", lat:35.6676, lon:139.6922, t:"9:00 AM", stay:"", note:"Hand over the big bags, keep the overnight bag.", leg:["walk",4]},
  {name:"Breakfast: Bondi Cafe Yoyogi Beach Park", q:"Bondi Cafe Yoyogi Beach Park", lat:35.6700, lon:139.6900, t:"9:05 AM", stay:"45 min", note:"Australian brunch on the park's west edge, eggs and flat whites, no line to speak of. Alternatives a few doors away: Camelback's egg sandwich from a walk-up window, or a croissant from 365 Jours with a Little Nap coffee on a park bench. Konbini egg sando is also a legitimate answer.", leg:["walk",20]},
  {name:"Ota Memorial Museum of Art", stamp:"Goshuin at Togo Shrine, five minutes away behind Takeshita Street (the backup if Meiji Shrine's office was closed yesterday).", q:"Ota Memorial Museum of Art", lat:35.6700, lon:139.7050, t:"10:30 AM", stay:"55 min", note:"A small ukiyo-e museum a block off Omotesando: rotating Hokusai- and Hiroshige-era prints, shoes off, an hour well spent. Closed Mondays and for a few days between shows; check the current exhibition dates.", near:"Togo Shrine's pond garden hides behind Takeshita Street if you want five quiet minutes.", leg:["walk",5]},
  {name:"Kaitensushi Ginza Onodera, Omotesando (conveyor belt)", q:"Kaitenzushi Ginza Onodera Honten Omotesando", lat:35.6662, lon:139.7085, t:"11:30 AM", stay:"1 hr", note:"Replaces Katsumidori, which closed with Seibu Shibuya on Sep 30, 2026. The flagship conveyor-belt shop of the Ginza Onodera sushi group, two minutes from the museum: 5-1-6 Jingumae, Il Palazzino Omotesando 1F, open daily 10:30 AM–10:30 PM, about ¥3,000–5,000 each. Toyosu tuna (akami, chutoro, otoro), Hokkaido uni and botan shrimp go round the belt; order anything that isn't passing from the chefs. No reservations and Saturday lines build from noon, so go at 11:30, before the rush; if there's a waitlist sheet or ticket machine at the door, put your name down and browse Cat Street until you're called. Fallback: Uobei in Shibuya (touch-screen orders on a bullet-train track, about ¥110 a plate).", leg:["walk",3]},
  {name:"Cat Street hour: RAGTAG, ReFa, Mameya", q:"RAGTAG Harajuku", lat:35.6685, lon:139.7055, t:"12:35 PM", stay:"to 1:35", note:"RAGTAG for archive designer, Kindal and BerBerJin if you're quick, the ReFa Boutique in Omotesando Hills to try the Beautech dryer (tax-free, ask for the 100–240V version), and a cup brewed to order at Koffee Mameya's bean bar.", leg:["train",20]},
  {name:"The Head Spa Tokyo, Shibuya", q:"The Head Spa Tokyo Shibuya", lat:35.6578, lon:139.7040, t:"2:00 PM", stay:"70 min", note:"3-18-7 Shibuya, 3F, two minutes from the station's C2 exit; ¥12,100 for the 70-minute course, ¥14,300 for 90 with the head bath. Ask for the two-seat Annex room (3-6-19 Shibuya, B1) so you're side by side. Book on headspatokyo.com.", leg:["walk",6]},
  {name:"Shibuya Crossing + Shibuya Sky", stamp:"Free eki stamp at JR Shibuya Station; ask at the ticket office.", q:"Shibuya Sky", lat:35.6585, lon:139.7022, t:"3:30 PM", stay:"to ~4:45", note:"Cross it, watch it from the Starbucks window above the Tsutaya building, then up to Shibuya Sky for the 4:15 sunset slot if you booked it (tickets release about a month out and sunset sells first; sunset is ~4:30). Mag's Park on the Magnet building roof is the cheap look straight down on the crossing if Sky is gone.", leg:["walk",15]},
  {name:"TRUNK, free time", q:"TRUNK Hotel Yoyogi Park", lat:35.6676, lon:139.6922, t:"5:00 PM", stay:"to 6:00", note:"Walk home through Tomigaya. Nap, the rooftop, or anything you skipped. Change for dinner. Taxi at 6:00.", leg:["taxi",10]},
  {name:"Two Rooms terrace (optional pre-dinner drink)", q:"Two Rooms Grill Bar Aoyama", lat:35.6655, lon:139.7125, t:"6:15 PM", stay:"30 min", note:"5th-floor rooftop terrace on the AO building at the Omotesando crossing (3-11-7 Kita-Aoyama): skyline views, cocktails and wine, smart casual, a DJ on Saturdays. Bar-stool seats on the edge are the ones to ask for. Calmer alternative: a pot of hojicha at Sakurai Japanese Tea Experience in the Spiral building, 5 minutes away on Aoyama-dori.", leg:["walk",10]},
  {name:"Yakiniku Ushigoro Omotesando (booked)", q:"Yakiniku Ushigoro Omotesando", lat:35.6630, lon:139.7090, t:"7:00 PM", stay:"2 hrs", note:"5-50-3 Jingumae, Urban Terrace Aoyama 2F. Booked at the counter. Seasonal Master Course ¥15,800 per person (about $260 for two with drinks), or ask what the ¥12,400 Anniversary Course adds for a honeymoon. Note the honeymoon and the tree-nut allergy, and confirm staff grill the premium cuts. Two-hour seating; changes by phone; cancelled after a 30-minute no-show.", leg:["taxi",5]},
  {name:"Nonbei Yokocho (or Golden Gai)", q:"Nonbei Yokocho Shibuya", lat:35.6600, lon:139.7020, t:"9:15 PM", stay:"1 hr", note:"Optional. The six-seat bars under the Shibuya tracks, 5 minutes by taxi or 15 on foot down Aoyama-dori. Golden Gai is a 15-minute taxi to Shinjuku if you want the bigger version. Home is 10 minutes from either; Romancecar at 10 tomorrow."}
]},

{ n:6, date:"Sun Nov 29", title:"Romancecar, Owakudani, Moss Garden, Ryokan", base:"Gora Hanaougi Madoka no Mori, Hakone", intro:["Hakone is the mountain resort Tokyo has escaped to for 400 years. The whole area is the caldera of a volcano that last erupted about 3,000 years ago, which is why there's a crater lake (Ashinoko), steaming valleys, and hot springs everywhere. In the Edo period the Tōkaidō highway between Edo and Kyoto climbed over Hakone pass, and the shogunate put its most important checkpoint here to control who went in and out of the capital; the inns that fed and bathed travelers became the onsen ryokan of today. Odakyu's Romancecar has carried Tokyoites here since 1957, and the GSE you're riding, introduced in 2018, is built for the view, with windows that run almost to the ceiling.", "From Hakone-Yumoto the Tozan railway switchbacks up the mountain to Gōra, a resort village developed in the 1910s for wealthy Tokyo families. Gōra Park, from 1914, was the first French-style formal garden in Japan, laid out on a slope with a fountain in the middle. From Gōra the 1921 cable car (really a funicular) climbs to Sōunzan, and the ropeway, which opened in 1959, carries you over the edge of the caldera to Ōwakudani, the \"Great Boiling Valley,\" where the ground hisses with sulfur vents and the famous black eggs (kuro-tamago) are boiled in the hot springs until the iron and sulfur turn the shells black; eating one is said to add seven years to your life. On a clear day Mount Fuji fills the sky behind it. The Hakone Museum of Art, back near Gōra, was founded in 1952 by Okada Mokichi to show Japanese ceramics, but what people come for is the moss garden: 130 kinds of moss under 200 maples, at its best exactly now.", "Tonight is the ryokan, the classic Japanese inn: tatami rooms, a yukata to wear, a soak in the hot spring (wash first, then soak; no swimsuits; tattoos are fine in a private bath), and a kaiseki dinner. Kaiseki is the multi-course cuisine that grew out of the tea ceremony in Kyoto in the 1500s, a sequence of small dishes that follows the season, each cooked a different way (raw, simmered, grilled, steamed, fried) and plated on a different piece of ceramic. Kappō means the same food served at a counter where you watch it made. Madoka no Mori is one of the newer, quieter inns in Gōra, every room with its own open-air bath, which is why we picked it for the one night in the mountains."], note:"Romancecar booked: Super Hakone 9, 10:00 from Shinjuku, Car 1 seats 6C/6D. Everything else runs on Suica plus a ropeway round trip bought at Sōunzan. Load about ¥10,000 on each Suica. The Hakone Free Pass (¥7,100) doesn't pay off for this up-and-back; it only wins if you add Lake Ashi. If the ropeway is stopped for wind, skip Owakudani and give the Hakone Museum of Art and Gora Park the whole afternoon.", stops:[
  {name:"TRUNK, checkout", q:"TRUNK Hotel Yoyogi Park", lat:35.6676, lon:139.6922, t:"9:00 AM", stay:"", note:"Konbini breakfast from the 7-Eleven or Lawson by Yoyogi-Hachiman (egg sando, onigiri, a Boss coffee) to eat on the train. Taxi to Shinjuku Station's Odakyu side, 15 minutes.", leg:["taxi",15]},
  {name:"Shinjuku, Romancecar (booked)", q:"Shinjuku Station Odakyu Romancecar", lat:35.6896, lon:139.7006, t:"9:40 AM", stay:"dep 10:00", note:"Booked: Super Hakone 9 (GSE), Shinjuku 10:00 → Hakone-Yumoto 11:21, Car 1, seats 6C and 6D, ¥2,300 paid. Car 1 is the front car, just behind the observation section. Tap Suica at the Odakyu gate for the base fare (¥1,261); the limited express ticket lives on your phone (EMot), so keep it charged. Fuji appears after Shin-Matsuda on a clear morning.", leg:["train",85]},
  {name:"Hakone-Yumoto: drop the bags", stamp:"Free eki stamp at Hakone-Yumoto, and at most Hakone Tozan Railway stations up the line.", q:"Hakone-Yumoto Station", lat:35.2318, lon:139.1050, t:"11:21 AM", stay:"15 min", note:"Hakone Luggage Transport Service counter inside the station: hand over the overnight bags by 12:00 and they're at the inn after 3 PM (¥1,500 a bag). Confirm Madoka no Mori is a partner inn when you book; if not, use the coin lockers at Gora Station instead. Then the Hakone Tozan Railway platform, Suica again.", near:"Steamed buns: Manjuya Nanohana, 30 seconds from the station exit (705 Yumoto, open 8:30–6 on weekends). Get the Hakone no Otsuki-sama, a warm onsen manju at about ¥120 each, to eat on the bench out back. Skip the rabbit-shaped Tsuki no Usagi, which has chestnut inside. Yumoto's main street across the river has more manju and Hakone fish-cake shops if you have time.", leg:["train",40]},
  {name:"Gora Station", stamp:"Free eki stamp at Gora Station.", q:"Gora Station Hakone", lat:35.2501, lon:139.0475, t:"12:15 PM", stay:"", note:"The little two-car switchback train climbs through three zigzags; this is the top of the line.", leg:["walk",6]},
  {name:"Lunch: Gyoza Center", q:"Gyoza Center Hakone Gora", lat:35.2492, lon:139.0458, t:"12:25 PM", stay:"1 hr incl. the wait", note:"Hakone's favorite casual lunch: handmade gyoza in several styles, ramen and udon. Sign the waitlist sheet at the door; Sunday noon usually means 15–30 minutes. Cash only, open 11–3, closed Thursdays. Backup: Gora Brewery & Grill by the station.", leg:["walk",6]},
  {name:"Cable car, Gora → Sōunzan", q:"Gora Station Hakone Tozan Cable Car", lat:35.2501, lon:139.0475, t:"1:30 PM", stay:"10-min ride", note:"Every 10–15 minutes, ¥430, Suica works. Sit facing uphill for the view back over Gora.", leg:["train",10]},
  {name:"Ropeway, Sōunzan → Owakudani", stamp:"Stamps at both ropeway stations, Sōunzan and Owakudani.", q:"Sounzan Station Hakone Ropeway", lat:35.2453, lon:139.0337, t:"1:45 PM", stay:"10-min ride", note:"Buy a round trip Sōunzan–Owakudani at the window (about ¥3,000 each; ¥2,000 one way). The gondola floats over the ridge and the steaming valley; Fuji appears to the northwest on a clear day. Peak-season Sundays can mean a 20–30 minute line here.", leg:["train",10]},
  {name:"Owakudani", stamp:"Owakudani station's stamp, plus the long-life Enmei Jizō near the valley.", q:"Owakudani Hakone", lat:35.2440, lon:139.0195, t:"2:00 PM", stay:"45 min", note:"The volcanic valley: sulfur vents, the black eggs boiled in the hot springs (each one adds seven years, so the story goes), and the best Fuji view of the day from the station terrace. Some paths close when volcanic activity rises; follow the signs. Ride down by 2:50 so the museum fits before its 4:00 last entry.", near:"Snacks: kuro-tamago, the black eggs, sold in small bags at the kiosk (eat them warm; share one), and the station shops' black-egg-themed sweets. The station restaurant has the big-window view if you want to sit with a hot drink.", leg:["train",20]},
  {name:"Hakone Museum of Art, Kōen-kami", q:"Hakone Museum of Art", lat:35.2475, lon:139.0420, t:"3:05 PM", stay:"45 min", note:"Ropeway back down, then the cable car down to Kōen-kami, two stops above Gora, and a three-minute walk. The moss garden under 200-odd maples is at its peak the last week of November; have a bowl of matcha at the Shinwatei teahouse (serves until 3:30). Open daily in November 9:30–4:30, last entry 4:00. Tickets are ¥1,500 each, paid at the entrance; it's separate from the train and ropeway fares.", near:"The galleries hold Japanese ceramics if you want ten minutes indoors; the garden is the reason to come.", leg:["walk",15]},
  {name:"Gora Park, walking down", q:"Hakone Gora Park", lat:35.2485, lon:139.0455, t:"3:55 PM", stay:"20 min", note:"Kōen-kami sits at the top of the park, so walk down through it to Gora Station: the French-style terraces, the fountain, the valley view in the last light (sunset is about 4:30).", near:"The park's greenhouse and café are good for warming up; Gora Brewery & Grill by the station if you want one craft beer before the inn.", leg:["walk",3]},
  {name:"Gora Station: call the inn's shuttle", q:"Gora Station Hakone", lat:35.2501, lon:139.0475, t:"4:15 PM", stay:"10 min", note:"Collect the bags if they're in a locker, then call Madoka no Mori (+81-460-82-4100); pickups run 3:00–6:00 and usually arrive in 5–10 minutes.", leg:["taxi",8]},
  {name:"Madoka no Mori, check-in", q:"Gora Hanaougi Madoka no Mori", lat:35.2465, lon:139.0400, t:"4:30 PM", stay:"to dinner", note:"Room 202. Yukata on and a soak before dinner; the large baths run 3 PM to midnight and 5 to 10 AM."},
  {name:"Kappo Mugen dinner (booked)", q:"Gora Hanaougi Madoka no Mori", lat:35.2466, lon:139.0401, t:"6:30 PM", stay:"2.5 hrs", note:"Live-cooking kaiseki counter, sake pairing, then a starlit soak. Allergy note confirmed with Katherine."}
]},

{ n:7, date:"Mon Nov 30", title:"Shinkansen, Gion on Foot, Kiyomizu Lit", base:"Hotel The Celestine Kyoto Gion", intro:["The Tōkaidō Shinkansen was the first bullet train in the world, opened in October 1964 for the Tokyo Olympics along the same corridor as the old Tōkaidō highway; today it carries about 150 million passengers a year and has never had a fatal accident. Odawara to Kyoto is two hours, and the D-side window gives you Mount Fuji about 15 minutes after you leave, then tea fields, then the Nagoya sprawl, then Kyoto. Kyoto was Japan's capital for over a thousand years (794 to 1868), laid out on a Chinese grid, and was spared the bombing of 1945; the story goes that the American Secretary of War, who had honeymooned there, struck it from the target list. It has 17 World Heritage sites, 2,000 temples and shrines, and a stubborn, refined local culture that still refers to Tokyo as a new town.", "Gion, where you're sleeping, is Kyoto's most famous geisha district. It grew up in the Edo period as a street of teahouses serving pilgrims to Yasaka Shrine and turned into the entertainment quarter where geiko (the Kyoto word for geisha) and maiko (apprentices) are trained in dance, music, and conversation. The wooden machiya townhouses along Hanamikōji are the ochaya, the teahouses, and you'll see maiko in their white makeup and trailing obi hurrying to appointments around dusk. Kennin-ji, at the bottom of Hanamikōji, is the oldest Zen temple in Kyoto, founded in 1202 by the monk Eisai, who brought both Zen Buddhism and tea seeds back from China and is credited with starting Japan's tea culture; its treasures are the Wind and Thunder Gods screens (the originals are in the museum; the copies are what's on view) and the pair of dragons painted across the ceiling of the Dharma Hall in 2002.", "Higashiyama, the hillside east of Gion, is the Kyoto of the postcards. The Yasaka Pagoda (Hōkan-ji) is a 46-meter five-story pagoda that legend says Prince Shōtoku founded in 592; the current tower is from 1440 and the lanes around it, Ninenzaka and Sannenzaka, are preserved stone-paved slopes of old shops and teahouses. They lead up to Kiyomizu-dera, founded in 778 and one of the most visited temples in Japan, famous for the great wooden stage of the main hall (1633), built out 13 meters over the hillside on a lattice of pillars without a single nail; \"to jump off the stage at Kiyomizu\" is the Japanese way of saying you've taken a leap of faith. The autumn night illumination lights the maples below the stage and a single blue beam into the sky; Nov 30 is the last night of this year's run. Pontochō, where you eat, is a 500-meter alley between the Kamo River and Kiyamachi street, built on an embankment in 1670 and another of Kyoto's five geisha districts; the restaurants along it face the river. Yasaka Shrine, founded in 656 and the home of the Gion Matsuri festival since 869, keeps its hundreds of lanterns lit all night, so the walk home passes through them."], stops:[
  {name:"Ryokan breakfast and checkout", q:"Gora Hanaougi Madoka no Mori", lat:35.2465, lon:139.0400, t:"7:30 AM", stay:"to ~10:00", note:"Sunrise onsen, Japanese breakfast, unhurried checkout by 10. The shuttle takes you to Gora (departures 9:15–11:00); Tozan railway down to Hakone-Yumoto and on to Odawara on Suica (about ¥770).", leg:["train",45]},
  {name:"Odawara, shinkansen (booked)", stamp:"Free eki stamp at Odawara Station before you board.", q:"Odawara Station", lat:35.2565, lon:139.1553, t:"11:30 AM", stay:"train 12:07", note:"Booked on SmartEX (reservation 2001): Hikari 641, Odawara 12:07 → Kyoto 14:12, no change. Green Car, Car 8, seats 2C + 2D (D is the Fuji window; she appears about 15–20 minutes out, past Mishima). Boarding: scan the QR tickets in the SmartEX app at the shinkansen gate, or print paper tickets at a ticket machine first. Ekiben from the Odawara station shops.", leg:["train",125]},
  {name:"Celestine Gion, check-in", q:"Hotel The Celestine Kyoto Gion", lat:34.9985, lon:135.7765, t:"~2:40 PM", stay:"40 min", note:"Forwarded luggage is waiting. Freshen up. The whole afternoon is on foot within 15 minutes of the door.", leg:["walk",2]},
  {name:"Kennin-ji", stamp:"Goshuin at Kennin-ji's office by the entrance (open to 4:30).", q:"Kennin-ji Temple Kyoto", lat:35.0005, lon:135.7740, t:"3:15 PM", stay:"45 min", note:"Kyoto's oldest Zen temple is literally behind the hotel: the twin-dragon ceiling, the Wind and Thunder Gods screens, the dry garden. ¥800, last entry 4:30. Open Mondays.", leg:["walk",6]},
  {name:"Yasaka Pagoda → Yasaka Koshindo → Ninenzaka", q:"Yasaka Pagoda Hokanji Kyoto", lat:34.9985, lon:135.7795, t:"4:05 PM", stay:"45 min", note:"Up Yasaka-dori to the five-story pagoda as the light goes (sunset about 4:45), the bauble-hung Koshindo shrine beside it, then the stone steps of Ninenzaka as the shops put their lanterns on. You're back on these lanes late tomorrow morning for mochi and Le Labo, so just wander.", near:"Matcha stop: Kasagiya, a 100-year-old sweets house at the top of Ninenzaka, for matcha and ohagi (to 6; closed Tue), or a seat in Starbucks Ninenzaka's tatami room.", leg:["walk",12]},
  {name:"Kiyomizu-dera night illumination", stamp:"Seal offices are closed at night. Kiyomizu's office is open by day; on Dec 1 it's a 10-minute walk up from Ninenzaka around 11:30 if you want the stamp.", q:"Kiyomizu-dera", lat:34.9949, lon:135.7850, t:"5:30 PM", stay:"45 min", note:"Tonight is the last night of the 2026 autumn light-up (Nov 21–30), lights on at 5:30, last entry 9:00, regular admission at the gate, no booking. Be at the gate for the 5:30 opening: the stage over the lit maples, the blue beam over the city. It's a 12-minute uphill walk from Ninenzaka, 20 from the hotel. Leave by 6:20; the taxi rank is at the bottom of Kiyomizu-michi.", leg:["taxi",20]},
  {name:"Yakiniku Kiraku, Pontocho", q:"Yakiniku Kiraku Pontocho Kyoto", lat:35.0060, lon:135.7710, t:"7:00 PM", stay:"90 min", note:"Her Pontocho yakiniku save. Booked; this one stays on Nov 30. Taxi from Gojozaka allowing 20 minutes on a light-up night, or the 25-minute walk down through Yasaka and over the Shijo bridge if you left Kiyomizu early.", near:"Hello Dolly, the jazz bar two doors down the alley, for one no-cover drink after.", leg:["walk",20]},
  {name:"Yasaka Shrine lanterns, walk home", stamp:"Get Yasaka's goshuin on the Dec 1 afternoon walk instead; the office is closed at night.", q:"Yasaka Shrine Kyoto", lat:35.0037, lon:135.7786, t:"9:00 PM", stay:"20 min", note:"Back over the Shijo bridge, up Shijo past the teahouses to Yasaka Shrine's lantern-lit dance stage, which is open all night, then down Hanamikoji to the hotel. 20 minutes door to door."}
]},

{ n:8, date:"Tue Dec 1", title:"Moss Temple, Higashiyama, Rings, Pontocho Crawl", base:"Celestine Gion", intro:["Saihō-ji is the moss temple, and the one Kyoto garden people cross the world for. It began as a Nara-period temple, was in ruins by the 1300s, and in 1339 the Zen master and garden designer Musō Soseki rebuilt it around a pond shaped like the character for heart; the moss, 120 species of it, took over the garden on its own in the centuries after and became the point. Since 1977 the temple has admitted visitors only by advance reservation and only after they copy a sutra, a decision taken to stop the crowds from destroying the moss, which is why it still feels like a secret. It's a World Heritage site and the model for the dry gardens at Tenryū-ji and the Golden Pavilion, both designed by the same monk.", "Back in Higashiyama, Ninenzaka is the lower of the two stone-paved slopes, a lane of 1900s wooden shops that has somehow absorbed a Starbucks, a Le Labo, and Mochi Mochi without losing its face. Hikiniku to Comme is the Kyoto restaurant everyone has watched a video of: a hamburg steak (hambāgu, Japan's beloved loose-ground beef patty, a Meiji-era adoption from German food) grilled over charcoal in front of you, three rounds, with rice from a clay pot and a line of condiments. glänta is a jewelry studio on the same lane where you'll make your own rings, hammering and finishing a pair in silver or gold in about an hour.", "Maruyama Park, Kyoto's oldest public park (1886), sits between Yasaka Shrine and the hills; the weeping cherry in the middle is the city's most famous tree in April and a fine bare silhouette in December. Shirakawa, the stream that runs through the northern edge of Gion under willows and past the Tatsumi Bridge, is the prettiest hundred meters in the district at dusk, and Hanamikōji is where you're likeliest to see a maiko. The evening is a walk-in crawl through Pontochō and the alleys off it: yakitori (skewers over binchōtan charcoal, each cut of the chicken its own course), tempura at a counter where each piece is fried and served one at a time, a kissaten (a Shōwa-era coffee house, dark wood and jazz) for dessert, and a proper cocktail bar to finish; Kyoto's bar culture is quieter and more serious than Tokyo's, and Bee's Knees has been on the Asia's 50 Best Bars list."], note:"One clean out-and-back to Saihō-ji in the morning (it moved here because Dec 2 only offers morning entries and the boat is booked), then the rest of the day on foot from the hotel. This also replaces the Kiyomizu-at-dawn repeat, since you see it lit the night before. Hikiniku to Comme is closed Wednesdays, so today is its day. The evening is a progressive dinner with no reservations: drinks at one bar, a bite at a yakitori counter, tempura, dessert at a retro kissaten, a speakeasy nightcap. Every swap is a gold star on the map.", stops:[
  {name:"Celestine, breakfast + taxi west", q:"Hotel The Celestine Kyoto Gion", lat:34.9985, lon:135.7765, t:"8:50 AM", stay:"", note:"A slower start after the light-up night: breakfast at 8 (the hotel buffet is ¥4,400 each, or % Arabica by the pagoda at 9 if you're quick), then have the front desk call a taxi for 8:50. Saihō-ji is about 35 minutes southwest.", leg:["taxi",35]},
  {name:"Saihō-ji (Kokedera) moss temple (booked)", stamp:"Saihō-ji gives a goshuin; ask at the end of the visit.", q:"Saihoji Temple Kokedera", lat:34.9920, lon:135.6840, t:"9:30 AM entry", stay:"80 min", note:"Booked: 9:30 entry, Tue Dec 1 (Nichi-nichi Sanpai, the regular visit, through intosaihoji.com; booking is on your My Page). Trace a sutra in the main hall, then walk 120 species of moss in near-silence; morning light is the best of the day for it. Ages 13 and up.", leg:["taxi",35]},
  {name:"Ninenzaka, Mochi Mochi + Le Labo", q:"Ninenzaka Kyoto", lat:34.9975, lon:135.7808, t:"11:25 AM", stay:"1 hr", note:"Taxi straight back to the lanes: mochi pounded in front of you at Mochi Mochi (strawberry daifuku ¥1,000, frothy matcha at GOKAGO next door), then Le Labo's 145-year-old machiya. You saw Kiyomizu lit last night; its seal office is 10 minutes uphill if you want the stamp.", near:"Ichizawa Shinzaburo canvas bags on Higashioji (closed Tuesdays, so not today).", leg:["walk",5]},
  {name:"Hikiniku to Comme (booked)", q:"Hikiniku to Comme Kyoto", lat:35.0000, lon:135.7790, t:"12:45 PM", stay:"1 hr", note:"Booked for 12:45 (Advance Priority Ticket, prepaid). Beef balls three ways: charcoal patties grilled in front of you, fresh rice, a condiment bar. Arrive a few minutes early with the TableCheck confirmation. Closed Wednesdays.", leg:["walk",6]},
  {name:"Hotel siesta", q:"Hotel The Celestine Kyoto Gion", lat:34.9985, lon:135.7765, t:"2:00 PM", stay:"1 hr 15 min", note:"Nap, bath, dress warm for the evening. Leave at 3:15 for the rings.", leg:["walk",8]},
  {name:"Ring making at glänta Ninenzaka", q:"glanta Kyoto Ninenzaka", lat:34.9982, lon:135.7817, t:"3:30 PM", stay:"1 hr", note:"Make each other's rings at the bench and walk out wearing them, engraving inside included. Silver from ¥5,200 (2 mm) to ¥13,800 (7 mm); 10K gold from ¥28,600, 18K from ¥53,500. 45–60 minutes, open 10–6; book online by the day before (075-606-5775). For forged 18K or platinum bands that take about two hours, Akanece Kiyomizu, five minutes away, is the alternative (from ¥16,500 plus metal; asoview).", leg:["walk",12]},
  {name:"Maruyama Park + Yasaka Shrine", stamp:"Yasaka Shrine's goshuin office, by the main hall; get there before 5.", q:"Yasaka Shrine Kyoto", lat:35.0037, lon:135.7786, t:"4:40 PM", stay:"25 min", note:"Wearing the new rings, down Nene-no-michi into Maruyama Park (the big weeping cherry, the pond) and through the back of Yasaka Shrine as its lanterns come on.", leg:["walk",5]},
  {name:"Hanamikoji + Shirakawa at dusk", q:"Hanamikoji Street Kyoto", lat:35.0030, lon:135.7750, t:"5:10 PM", stay:"25 min", note:"Out Yasaka's west gate and straight down Gion's teahouse lanes in the hour maiko head to work, then the Shirakawa canal and Tatsumi bridge. Kodai-ji's illumination is a star on the map if you'd still rather do it.", leg:["walk",10]},
  {name:"Drinks: Bar Atlantis", q:"Bar Atlantis Pontocho Kyoto", lat:35.0046, lon:135.7708, t:"5:45 PM", stay:"40 min", note:"The crawl, all walk-in. Course 1: a river-facing cocktail and whisky bar in the alley since 1989 (Tabelog 3.51), window seats over the Kamo; ¥500 table charge. Swap: Masuya Saketen's sake standing bar on Kawaramachi. Every swap is a gold star on the map.", leg:["walk",4]},
  {name:"Bite: Yasohachi charcoal yakitori", q:"Pontocho Yasohachi Kyoto", lat:35.0072, lon:135.7710, t:"6:30 PM", stay:"45 min", note:"Course 2, opposite Pontocho Park: Tamba chicken skewers at ¥200–250, negima, lotus-root tsukune, salted thigh, in an old machiya. 48 seats, walk-in, open to 11:30. Swap: Masuda's obanzai counter takes walk-ins at 5–6 if you'd rather start there (cash only).", leg:["walk",6]},
  {name:"Main: Komefuku tempura counter", q:"Komefuku Kyoto Kiyamachi", lat:35.0084, lon:135.7702, t:"7:20 PM", stay:"1 hr", note:"Course 3, on Kiyamachi by Sanjo: tempura fried in rice oil plus nigiri at a 16-seat counter, ordered piece by piece, ~¥2,500–4,000 each; open to 11, walk-in. Swap: Kyoto Kamo Soba Den for Kyoto duck tsukesoba (no reservations), or Izumoya's unagi by the Shijo bridge. Robin's river table is the bookable upgrade.", leg:["walk",2]},
  {name:"Dessert: Kissa Gabor", q:"Kissa Gabor Kyoto Kiyamachi", lat:35.0090, lon:135.7702, t:"8:30 PM", stay:"40 min", note:"Course 4, two doors up: a retro basement kissaten-bar (Tabelog 3.52) with house custard pudding, hotcakes, cream soda or a cocktail; open to 11, walk-in. No cards (QR OK).", leg:["walk",6]},
  {name:"Nightcap: Bee's Knees", q:"Bee's Knees Kyoto", lat:35.0050, lon:135.7702, t:"9:20 PM", stay:"45 min", note:"Course 5, behind the yellow door by the Takase canal: a Prohibition-style speakeasy on Asia's 50 Best Bars, no cover, '90s hip-hop; walk-in, arrive before 10. Swap: L'Escamoteur or Hello Dolly back toward Shijo. Home is a 20-minute walk or a 7-minute taxi."}
]},

{ n:9, date:"Wed Dec 2", title:"Arashiyama Dawn, River Boat, Golden Pavilion, Badu", base:"Celestine Gion", intro:["Arashiyama, on the western edge of Kyoto, has been the aristocracy's retreat since the Heian period a thousand years ago, when nobles came out to boat on the river and write poems about the maples. The bamboo grove in Sagano is a few hundred meters of towering mōsō bamboo on a path between Tenryū-ji and the Ōkōchi villa; it's the most photographed place in Kyoto and at 7:45 on a December morning you'll have it almost to yourselves, which is the whole reason for the early taxi. Tenryū-ji was founded in 1339 by the shogun Ashikaga Takauji to appease the spirit of the emperor he'd betrayed; it's ranked first among Kyoto's five great Zen temples, and its garden, designed by Musō Soseki around a pond with the Arashiyama hills borrowed as backdrop, is one of the oldest in Japan that still looks the way its designer intended. Togetsukyō, the \"moon-crossing bridge\" at the bottom of the hill, was named by Emperor Kameyama in the 1200s when he watched the moon seem to walk across it.", "The Hozugawa boat ride is a 16-kilometer, two-hour descent of the gorge above Arashiyama in a flat wooden boat steered with poles and oars by three boatmen. The river was opened to traffic in 1606 by the merchant Suminokura Ryōi, who blasted the rapids to float lumber, rice, and charcoal down from the Tamba highlands to Kyoto; when the railway killed the trade in the 1890s the boatmen started carrying tourists instead, and they've been doing it ever since. It ends under the bridge where you started the morning. Kinkaku-ji, the Golden Pavilion, was the shogun Ashikaga Yoshimitsu's retirement villa, built in 1397 with its top two floors covered in gold leaf and turned into a temple on his death; in 1950 a young monk burned it to the ground (Mishima wrote a novel about him) and the building you see is the 1955 reconstruction, re-gilded in the 1980s with gold five times thicker than the original. Ryōan-ji, ten minutes away, is the opposite: a walled rectangle of raked white gravel with fifteen rocks laid out around 1500 so that from no single point can you see all fifteen at once. Nobody knows who designed it or what it means, and that's the appeal.", "The Philosopher's Path is a two-kilometer stone walk along the Lake Biwa canal, dug in the 1890s to bring water and the city's first electricity into Kyoto; the philosopher is Nishida Kitarō, the founder of the Kyoto School, who walked it every morning on his way to the university. It's lined with cherries for spring and maples for now. Eikan-dō (its proper name is Zenrin-ji) dates from 853 and is Kyoto's most famous temple for autumn color, 3,000 maples lit from below in the evening, with a small statue of Amida inside who is looking back over his shoulder; the story is that the monk Eikan, chanting at dawn, saw the statue step down and lead him, and when he stopped in surprise the Buddha turned and said, \"Eikan, you're slow.\" Hōnen-in, at the north end of the path, is a small temple from 1680 behind a thatched gate and two raked sand mounds, whose inner halls open only in spring and fall (the gate and grounds are always open). Badu is dinner: the charcoal izakaya and wine bar run by the team behind Monk, the pizza place on the Path that became impossible to book; it's a short taxi from the fire station at the end of the lane."], note:"West in the morning, northwest after lunch, home for a rest, northeast for the evening: Arashiyama at dawn, the booked 10:00 boat down the gorge, lunch by the bridge, Kinkaku-ji and Ryōan-ji, an hour-plus at the hotel, then the Philosopher's Path at dusk, Eikan-dō's light-up and Badu (booked). The tea ceremony is Thursday, in kimono.", stops:[
  {name:"Celestine, taxi west", q:"Hotel The Celestine Kyoto Gion", lat:34.9985, lon:135.7765, t:"7:15 AM", stay:"", note:"Have the front desk call the taxi the night before. Arashiyama is 30 minutes at this hour.", leg:["taxi",30]},
  {name:"Bamboo Grove", stamp:"Goshuin at Nonomiya Shrine at the grove's mouth, once its office opens.", q:"Arashiyama Bamboo Grove", lat:35.0170, lon:135.6715, t:"7:45 AM", stay:"30 min", note:"The grove, empty. Walk it twice.", near:"Nonomiya Shrine at the grove's mouth.", leg:["walk",3]},
  {name:"Tenryu-ji", stamp:"Goshuin at Tenryu-ji's temple office.", q:"Tenryu-ji", lat:35.0157, lon:135.6737, t:"8:30 AM", stay:"40 min", note:"UNESCO Zen garden, borrowed-scenery pond against the maple mountain. Opens 8:30; take the garden only (¥500) and leave by 9:10 for the train.", leg:["walk",10]},
  {name:"JR Saga-Arashiyama → Kameoka", stamp:"Free eki stamp at JR Saga-Arashiyama; the Torokko station next door has one too.", q:"Saga-Arashiyama Station", lat:35.0187, lon:135.6815, t:"9:20 AM", stay:"", note:"JR Sagano line local to Kameoka, about 12 minutes, ¥240 on Suica. If the Sagano Romantic Train is running on Wednesday Dec 2, its 9:02 from Torokko Saga is the prettier way up (leave Tenryu-ji by 8:50).", leg:["train",12]},
  {name:"Hozugawa boat (booked)", q:"Hozugawa Kudari Boarding Point Kameoka", lat:35.0135, lon:135.5905, t:"9:40 AM", stay:"boat dep 10:00", note:"Eight-minute walk from JR Kameoka. Check in at the second-floor reception before 10:00; the boat won't wait. Boats stop in storms or high water, so check hozugawakudari.jp that morning. Dress warm and take the blankets.", leg:["boat",120]},
  {name:"Togetsukyo Bridge landing", q:"Togetsukyo Bridge", lat:35.0128, lon:135.6778, t:"12:00 PM", stay:"", note:"Sixteen kilometers of gorge, rapids and herons later, the boatmen pole you under the bridge.", leg:["walk",3]},
  {name:"%Arabica + riverside lunch", q:"% Arabica Kyoto Arashiyama", lat:35.0125, lon:135.6775, t:"12:05 PM", stay:"75 min", note:"Her riverside coffee by Togetsukyo Bridge, then soba with the river view at Arashiyama Yoshimura or the river stalls. Taxi at 1:20.", leg:["taxi",15]},
  {name:"Kinkaku-ji", stamp:"Goshuin at Kinkaku-ji; the entry ticket itself is a paper talisman worth keeping.", q:"Kinkaku-ji", lat:35.0394, lon:135.7292, t:"1:35 PM", stay:"40 min", note:"Taxi 15 minutes from Arashiyama: the Golden Pavilion on its mirror pond, ¥500, a one-way loop that takes 30–40 minutes.", leg:["taxi",7]},
  {name:"Ryōan-ji rock garden", stamp:"Goshuin at Ryōan-ji.", q:"Ryoanji Temple Kyoto", lat:35.0345, lon:135.7183, t:"2:25 PM", stay:"30 min", note:"The fifteen stones in raked gravel (you can never see all fifteen at once), then the pond. About ¥600.", leg:["taxi",30]},
  {name:"Hotel rest", q:"Hotel The Celestine Kyoto Gion", lat:34.9985, lon:135.7765, t:"3:30 PM", stay:"1 hr 10 min", note:"The hotel sits between the northwest temples and the Philosopher's Path, so the stop costs about 15 minutes of extra taxi. Nap, shower, change for Badu.", leg:["taxi",15]},
  {name:"Philosopher's Path at dusk", q:"Philosopher's Path Kyoto", lat:35.0215, lon:135.7955, t:"4:55 PM", stay:"25 min", note:"Taxi from the hotel to the Ginkaku-ji end of the Path and walk the canal south in the blue hour (sunset is about 4:45), past Juugo's soba counter and where Monk sits, to Eikan-dō's gate.", leg:["walk",20]},
  {name:"Eikan-dō maple light-up", stamp:"Eikan-dō gives goshuin by day; the office is usually closed during the light-up.", q:"Eikando Zenrinji Kyoto", lat:35.0148, lon:135.7942, t:"5:30 PM", stay:"40 min", note:"In the gate as the light-up opens at 5:30: the pond and maples lit from below, the Tahoto pagoda above. Evening ticket is separate from the day one. Confirm 2026 dates on eikando.or.jp; it usually runs into early December.", leg:["walk",15]},
  {name:"Honen-in gate, lantern walk", q:"Honen-in Temple Kyoto", lat:35.0205, lon:135.7975, t:"6:25 PM", stay:"15 min", note:"Back north along the Path in the dark to the thatched gate of Honen-in at the foot of Daimonji, the quietest corner of the walk. Badu is three minutes from here.", leg:["walk",4]},
  {name:"Badu", q:"Badu Kyoto Shishigatani", lat:35.0218, lon:135.7985, t:"7:00 PM", stay:"2 hrs", note:"Monk's sister place, 42-1 Shishigatani Sakuradani-cho: a charcoal izakaya and wine bar cooking vegetables from local farms and their own fields, with a standing counter for wine and sake. Second seating; choose the sharing omakase (¥10,000 plus tax and 10% service, about ¥12,100 each) or order à la carte. Closed Sun and Mon. Book it yourselves on TableCheck (they refuse hotel and agent bookings): the window opened Oct 2 at noon Japan time, ¥10,000-a-head card hold, no refund inside 36 hours. Tree-nut note in the form. A taxi home is 15 minutes; have it meet you at the Shishigatani fire station, not the door.", near:"If Badu is gone, Cenci (Shogoin, 7-minute taxi, ¥24,200) is the fallback, with Kumano Wine House three minutes from it."}
]},

{ n:10, date:"Thu Dec 3", title:"Torii at Dawn, Kimono and Tea, Sushi, Nishiki", base:"Celestine Gion", intro:["Fushimi Inari is the head shrine of the 30,000 Inari shrines across Japan, founded in 711 by the Hata clan, immigrants from Korea who brought rice farming and silk weaving to the valley. Inari is the god of rice and, by extension, of sake, business, and prosperity, which is why every company in Japan wants a torii here: the roughly 10,000 vermilion gates that tunnel four kilometers up the mountain were each donated by a business or family, with the donor's name painted on the back. The foxes everywhere are Inari's messengers, holding keys to the rice granary in their mouths. The lower loops are packed by mid-morning; at 7:00 you'll walk through the Senbon Torii, the \"thousand gates,\" in near silence. Tōfuku-ji, a few minutes away, was founded in 1236 by the regent Kujō Michiie, who named it after Nara's two greatest temples (Tōdai-ji and Kōfuku-ji) and meant it to outdo them; its Sanmon gate from 1425 is the oldest Zen gate in Japan, and the Tsūtenkyō, a covered wooden bridge over a ravine of 2,000 maples, is the single most famous autumn view in Kyoto.", "The tea ceremony, chanoyu, is Kyoto's defining art. Tea came from China with the Zen monks in the 1100s, and in the 1500s the tea master Sen no Rikyū, serving the warlords Oda Nobunaga and Toyotomi Hideyoshi, stripped it down to the ritual you'll take part in: a small room, a few utensils, a bowl of whisked matcha, and the idea of wabi, finding beauty in the plain and imperfect. Camellia is a teahouse in Higashiyama where the host explains each movement in English. The kimono you'll wear for the day is how Kyoto dressed until the 1960s; the studio will dress you both, and the stone lanes of Higashiyama and Gion were built for exactly this. Sushi Matsumoto for lunch is Kyoto-style Edomae, a quiet counter where the chef serves one piece at a time.", "Nishiki Market is \"Kyoto's kitchen\": a 390-meter covered street of about 130 shops that began as a fish market in the 1300s and has sold the city's pickles, tofu, knives, dried fish, and yuba (tofu skin) to its restaurants ever since. Aritsugu, inside it, has forged blades since 1560, first swords for the imperial court and, after the sword ban, kitchen knives; they'll engrave your name in kanji on anything you buy. Teramachi, \"temple town street,\" is where Hideyoshi relocated the city's temples in 1590 to clear the center; it and the parallel Shinkyōgoku arcade are now the shopping streets, with Kyūkyodō's 1663 incense shop at one end and the vintage stores along it. Dinner is a Kyoto tour in three stops: Menya Inoichi, a Michelin Bib Gourmand ramen counter whose broth is built on dashi rather than pork; Kiyokiyo, a standing sake bar; and Francois Kissashitsu, a 1934 coffee house with a baroque interior that was the first café in Japan declared a cultural property, where artists and anti-war students gathered in the 1930s."], note:"Fushimi Inari and Tōfuku-ji first thing, then into kimono at 10 for the tea ceremony at 11 (both booked at Camellia's Flower Teahouse below Ninenzaka). Sushi Matsumoto at lunch, still in kimono, then a daylight kimono stroll through Gion's lanes before you change back. The afternoon is the Nishiki and Shijo shopping walk, then the walk-in ramen, sake and dessert evening. Sanjūsangen-dō moved to Friday morning, next to the station.", stops:[
  {name:"Celestine, out the door", q:"Hotel The Celestine Kyoto Gion", lat:34.9985, lon:135.7765, t:"6:30 AM", stay:"", note:"Hand the big bags to the front desk on the way out (takuhaibin to 1 Hotel Tokyo, about ¥2,500 a bag); sent today they arrive tomorrow, Dec 4. Live out of the overnight bags tonight. Walk 10 minutes to Gion-Shijo, then the Keihan line south to Fushimi-Inari, about 10 minutes on the train.", leg:["train",25]},
  {name:"Fushimi Inari Taisha", stamp:"Goshuin at the main shrine office near the entrance; several sub-shrines up the mountain give their own.", q:"Fushimi Inari Taisha", lat:34.9671, lon:135.7727, t:"7:00 AM", stay:"to 8:20", note:"Torii tunnels at first light. Climb to the Yotsutsuji viewpoint (about 40 minutes up) and come straight back down; today has a 10:00 kimono appointment.", near:"Vermillion Cafe at the gate for a coffee on the way out.", leg:["train",5]},
  {name:"Tōfuku-ji", stamp:"Goshuin at Tōfuku-ji's office.", q:"Tofuku-ji", lat:34.9763, lon:135.7740, t:"8:35 AM", stay:"to 9:25", note:"One Keihan stop north. The Tsutenkyo bridge over a valley of maples, ¥1,000 in peak season; it opens at 8:30 in the autumn season, so you're in with the first visitors. Have a taxi pick you up at the north gate at 9:25.", leg:["taxi",15]},
  {name:"Camellia Kimono Studio: dressing (booked)", q:"Camellia Flower Tea Ceremony Kyoto Ninenzaka", lat:34.9979, lon:135.7802, t:"10:00 AM", stay:"1 hr", note:"Right next to the Flower Teahouse, 349 Masuya-cho below Ninenzaka (taxi address: 京都市東山区桝屋町349-13, 茶道体験カメリア フラワー店). Be there by 9:50: they dress latecomers only if there's time. You strip to your underwear, so wear comfortable underlayers; they have hair accessories and can help with styling. Men's and women's kimono are booked. The rental is for the whole day; return by 5 PM to change back.", leg:["walk",1]},
  {name:"Tea ceremony, Camellia FLOWER (booked)", q:"Camellia Flower Tea Ceremony Kyoto Ninenzaka", lat:34.9979, lon:135.7802, t:"11:00 AM", stay:"~45 min", note:"Shared ceremony in Camellia's Higashiyama teahouse, in kimono: tea history, a seasonal sweet, then you each whisk your own bowl. Paid in full, ¥20,000 including both kimono rentals; ticket CML-T150293620. Tree nuts are on the booking. Full refund if cancelled more than 3 days ahead (kimono alone up to 2 days ahead). Phone 075-525-3238.", leg:["walk",15]},
  {name:"Sushi Matsumoto, lunch (booked)", q:"Sushi Matsumoto Gion Kyoto", lat:35.0025, lon:135.7760, t:"12:30 PM", stay:"75 min", note:"Booked for 12:00, but tea runs to about 11:45 and the walk down to Hanamikoji takes 15 minutes in zori sandals, so have the Celestine concierge ask to move it to 12:15–12:30 (lunch last order is 1:30). One Michelin star (2026), seven counter seats: ¥16,500 for 13 pieces, ¥19,800 for 17, ¥23,100 with appetizers. Sushi at a counter is easy in kimono; keep the sleeves back and use the napkin. Sushi is naturally low tree-nut risk; still note it.", leg:["walk",3]},
  {name:"Kimono stroll: Hanamikoji, Shirakawa, Yasaka, Ishibe-koji", q:"Tatsumi Bridge Shirakawa Kyoto", lat:35.0055, lon:135.7745, t:"1:45 PM", stay:"to 3:30", note:"The photo walk, in daylight this time: down Hanamikoji's teahouse fronts, over to the Shirakawa canal and Tatsumi bridge, then up to Yasaka Shrine's vermilion gate and back along Nene-no-michi and the stone lane of Ishibe-koji to the studio. Take it slow; zori are short-stride shoes.", near:"Kagizen Yoshifusa on Shijo for kuzukiri (arrowroot noodles in black-sugar syrup) if you want a sit-down sweet in kimono.", leg:["walk",10]},
  {name:"Camellia Kimono Studio: change back", q:"Camellia Flower Tea Ceremony Kyoto Ninenzaka", lat:34.9979, lon:135.7802, t:"3:35 PM", stay:"20 min", note:"Back by 5 PM at the latest. Changing now leaves time for Aritsugu before it closes at 4:30. If you'd rather keep the kimono on longer, skip Aritsugu (Kama-Asa in Tokyo is the knife backup) and change back at 4:45.", leg:["taxi",12]},
  {name:"Nishiki Market + Aritsugu", stamp:"Goshuin at Nishiki Tenmangu, the little shrine at the market's east end.", q:"Aritsugu Nishiki Market", lat:35.0051, lon:135.7661, t:"4:05 PM", stay:"45 min", note:"Taxi to the Teramachi end and go straight to Aritsugu first: it engraves your names on a knife while you wait and closes at 4:30 (closed Wednesdays; Thursday is fine). Then graze west: tamagoyaki on a stick, soy-milk doughnuts, pickles, yuba. Many stalls close by 5 or 6. Mind the chestnut and walnut sweets.", leg:["walk",6]},
  {name:"Okura resale + Daimaru, Shijo-Karasuma", q:"OKURA Kyoto Karasuma FORUM Shijo Karasuma", lat:35.0052, lon:135.7620, t:"4:55 PM", stay:"35 min", note:"Out the west end of Nishiki to Shijo-Karasuma: Okura (おお蔵) on the ground floor of FORUM Shijo-Karasuma for luxury bags, watches and jewelry resale (11–8), and Daimaru's depachika across the street.", near:"SALAMANCA VINTAGE is 8 minutes further west on Shijo if you still want designer resale; check its closing time.", leg:["walk",8]},
  {name:"Shinkyogoku + Teramachi: Kindal, SOU·SOU, Kyukyodo", q:"KINDAL Kyoto Shinkyogoku", lat:35.0054, lon:135.7667, t:"5:40 PM", stay:"45 min", note:"Back east under the arcade roofs: Kindal's three floors of designer secondhand, the SOU·SOU tabi-and-textile alley, Kyukyodo's incense and washi.", leg:["walk",8]},
  {name:"Menya Inoichi, ramen", q:"Menya Inoichi Kyoto", lat:35.0013, lon:135.7672, t:"6:30 PM", stay:"40 min", note:"Dinner, all walk-in. Michelin Bib Gourmand dashi ramen, white (light) or black (deeper), about ¥1,000; ticket machine. Expect a 15–30 minute line at this hour. Swap: Chinese Noodles Roku five minutes away.", leg:["walk",8]},
  {name:"Kyoto Stand Kiyokiyo, sake", q:"Kyoto Stand Kiyokiyo Kiyamachi", lat:35.0040, lon:135.7701, t:"7:20 PM", stay:"40 min", note:"A standing bar 150 m from the Shijo bridge with 20+ Kyoto sakes (Fushimi included), a three-glass tasting set, simmered gyutan; no cover.", leg:["walk",3]},
  {name:"Francois Kissashitsu, dessert", q:"Francois Kissashitsu Kyoto", lat:35.0031, lon:135.7695, t:"8:05 PM", stay:"40 min", note:"A 1934 Baroque coffee salon (Tabelog 3.73): rare cheesecake or pudding, or a glass of tawny port (last order 9:30). Skip the baked cakes (almond). Then 15 minutes home over the bridge; komorebino or Gion Finlandia are five minutes from the room if you want one more."}
]},

{ n:11, date:"Fri Dec 4", title:"Pancakes, 1,001 Kannon, Shinkansen, Akasaka", base:"1 Hotel Tokyo, Akasaka", intro:["Shirakawa, where you have breakfast, is the stream that runs down from the eastern hills through the top of Gion, lined with willows and the backs of the old teahouses; Panel Cafe sits on it. Sanjūsangen-dō is the last temple and arguably the most astonishing room in Japan. Its proper name is Rengeō-in, and it was built in 1164 by Taira no Kiyomori for the retired emperor Go-Shirakawa; the name means \"hall of thirty-three bays,\" for the spaces between the pillars of a wooden hall 120 meters long, the longest in the world. Inside stand 1,001 life-size gilded statues of the thousand-armed Kannon, 1,000 of them in ranked rows flanking a giant seated figure carved by Tankei in 1254, with 28 fierce guardian deities in front; it's said that every visitor can find a face they know among the thousand. In the Edo period samurai held an archery contest down the full length of the veranda, and the arrow scars are still in the beams.", "Kyoto Station, where you board, is itself a landmark: Hiroshi Hara's 1997 steel-and-glass hall was furiously controversial in a city of wooden temples and is now loved for its 15-story staircase and the view from the roof garden. The Nozomi is the fastest shinkansen service, Kyoto to Tokyo in about 2 hours 15 minutes, and Mount Fuji appears on the left (the E side) about an hour and a half in, around Shin-Fuji, in daylight on a 12:57 departure.", "Akasaka, your last Tokyo neighborhood, was the district of daimyō mansions under the shogunate and became the political heart of modern Japan: the Diet, the prime minister's residence, and the ministries are a few blocks away, and the ryōtei restaurants where deals were done over geisha entertainment gave Akasaka its old reputation. 1 Hotel Tokyo, which opened in 2026, sits on the hill above it. Toranomon, the \"tiger gate,\" was one of the gates of Edo Castle's outer moat; the Mori company has spent the last decade turning the area into Toranomon Hills, and the Station Tower, where falò+ is, opened in 2023 on top of a new subway station. falò+ is the Toranomon branch of a Daikanyama Italian restaurant that has held a Michelin Bib Gourmand for seven straight years, built around a charcoal grill, handmade pasta, and natural wine; Spotted Stone is the hotel's 38th-floor gin bar, where the city, Tokyo Tower, and on a clear evening Fuji are the view for sunset and the last drink."], note:"The last Kyoto morning: pancakes on the Shirakawa, then Sanjūsangen-dō on the way to the station (it moved here when the tea ceremony moved to Thursday), then the train to Tokyo and an Akasaka afternoon at the new hotel: sunset from the 38th-floor gin bar, then five minutes by taxi to falò+ in Toranomon Hills for handmade pasta and natural wine, and back up to the 38th floor for a last drink.", stops:[
  {name:"Celestine, last morning", q:"Hotel The Celestine Kyoto Gion", lat:34.9985, lon:135.7765, t:"8:50 AM", stay:"", note:"The big bags already left for 1 Hotel yesterday. A ten-minute walk along the Shirakawa to breakfast. Breakfast isn't included unless your rate says so: the hotel's buffet at Yasaka Endo (B1) is ¥4,400 each, 6:30–10:30.", leg:["walk",10]},
  {name:"Panel Cafe", q:"Panel Cafe Kyoto", lat:35.0060, lon:135.7740, t:"9:00 AM", stay:"50 min", note:"Fluffy pancakes on the Shirakawa, at opening to beat the line.", near:"Last canal photos in morning light.", leg:["walk",10]},
  {name:"Celestine, checkout", q:"Hotel The Celestine Kyoto Gion", lat:34.9985, lon:135.7765, t:"10:00 AM", stay:"15 min", note:"Check out and take the overnight bags in the taxi; keep them small, since they come with you to the temple and the train.", leg:["taxi",12]},
  {name:"Sanjūsangen-dō", stamp:"Goshuin at the temple office by the exit.", q:"Sanjusangendo Kyoto", lat:34.9879, lon:135.7718, t:"10:15 AM", stay:"45 min", note:"The 120-meter hall of 1,001 gilded Kannon statues, Kyoto's most astonishing interior; shoes off, no photos inside. Open 9–4 in winter, about ¥600. Ask at the ticket window where to leave the overnight bags. Taxi to Kyoto Station is 8 minutes.", leg:["taxi",8]},
  {name:"Kyoto Station, shinkansen (seat E)", stamp:"Free eki stamp at JR Kyoto Station near the ticket office.", q:"Kyoto Station", lat:34.9858, lon:135.7588, t:"dep ~12:57 PM", stay:"2¼-hr ride", note:"Book a Nozomi leaving about 12:55–1:00 (seat E for a goodbye Fuji; Green Car seat D) on SmartEX when sales open Nov 4 Japan time (Tue Nov 3, 7 PM Austin); it reaches Tokyo about 3:10. That leaves an hour at the station for lunch or ekiben from the food halls. If you'd rather have more Tokyo time, a Nozomi around 11:30 gets you in about 1:45.", leg:["train",135]},
  {name:"Tokyo Station → 1 Hotel", stamp:"Eki stamp at JR Tokyo Station (Marunouchi side).", q:"Tokyo Station", lat:35.6812, lon:139.7671, t:"3:10 PM", stay:"", note:"Taxi from the Yaesu or Marunouchi rank, 15–20 minutes, about ¥2,500.", leg:["taxi",18]},
  {name:"1 Hotel Tokyo, check-in", q:"1 Hotel Tokyo Akasaka Trust Tower", lat:35.6703, lon:139.7395, t:"3:30 PM", stay:"45 min", note:"Akasaka Trust Tower (Tokyo World Gate Akasaka), lobby on 38F, opened March 2026; Tameike-Sanno station is connected underground. The bags forwarded from Kyoto on Dec 3 are waiting. Pre-book tomorrow's 7:45 taxi now.", leg:["walk",1]},
  {name:"Spotted Stone (38F) for sunset", q:"1 Hotel Tokyo Spotted Stone bar", lat:35.6703, lon:139.7395, t:"4:15 PM", stay:"to 7:15", note:"Sunset is 4:27 and the sky glows until about 4:55, then the city lights come on. The hotel says no reservation is needed: go up at 4:15 and ask for a west-facing window, the Mt. Fuji side, or a Tokyo Tower window. 100-plus Japanese craft gins, cocktails about ¥3,000, Friday 'Stone Sessions' music 6–7. Spend the $100 credit here or on the nightcap.", leg:["taxi",6]},
  {name:"falò+ (farewell dinner)", q:"falò+ Toranomon Hills Station Tower", lat:35.6672, lon:139.7486, t:"7:30 PM", stay:"2 hrs", note:"Italian built around a charcoal grill, from the team behind Bib Gourmand falò in Daikanyama: handmade pasta (the chitarra in yuzu-kosho and nori cream is the one), about 25 natural wines by the glass, 18 seats with counter seats for two and a night view. 10-dish dinner set menu ¥9,800 plus ¥500 seat fee; about ¥27–30k for two with wine. Toranomon Hills Station Tower 4F (from B2 take the escalator to B1, then the lift to 4F). BOOKED: reservation 9L5FLC7GLM, 7:30 PM, 2 people, nut allergy on the booking. Same-day cancellation is ¥12,000 a head. Remind them at the table about the pistachio-miso dish.", leg:["taxi",6]},
  {name:"Spotted Stone nightcap, then pack", q:"1 Hotel Tokyo Spotted Stone bar", lat:35.6703, lon:139.7395, t:"9:45 PM", stay:"as long as you like", note:"Straight up to 38F and walk in; it doesn't take bookings after 9 PM anyway, and it's open until 1 AM on Fridays (last drinks 12:30). The city lit up below for the last toast. Pack tonight; the taxi is at 7:45.", near:"Don Quijote run: Picasso Akasaka is a 10-minute walk (open to 3 AM), or Roppongi's 24-hour store is a 5-minute detour on the taxi back from falò+. Both are big stars on the map."}
]},


{ n:12, date:"Sat Dec 5", title:"The Early Goodbye", base:"JL12 departs Haneda 10:55 AM", intro:["Haneda's Terminal 3 is a 30-minute taxi from Akasaka along the expressway over the bay, past the Rainbow Bridge and the Odaiba waterfront. Allow time at the terminal: the tax-free customs check happens at the kiosks before bag drop, and the Edo Koji street upstairs is a last chance for gifts. JL12 to Dallas is an 11-hour flight that lands the same morning you left, thanks to the date line; you'll have a Saturday that lasts about 38 hours.", "If there's an hour to spare, the observation deck on the fifth floor of Terminal 3 looks over the runways to the bay and, on a clear morning, to Fuji on the horizon, the same mountain you've been chasing since the Romancecar."], stops:[
  {name:"Breakfast at 1 Hotel", q:"1 Hotel Tokyo Akasaka Trust Tower", lat:35.6703, lon:139.7395, t:"7:00 AM", stay:"40 min", note:"NiNi on 38F opens for breakfast at 7:00 (hotel guests); Neighbors Café in the building opens at 6:30 for coffee, matcha and pastries to go (pastries from 7). Confirm both at check-in.", leg:["taxi",30]},
  {name:"Haneda Terminal 3", stamp:"The final eki stamp for the book at the airport station.", q:"Haneda Airport Terminal 3", lat:35.5494, lon:139.7798, t:"8:15 AM", stay:"to 10:55", note:"Right at the three-hours-before mark. T3's shops are excellent: Tokyo Banana, Royce, last KitKats, a final eki stamp at the airport station. The 4 PM late checkout goes unused; the flight decided that.", near:"Home: married, onsen-soft, already planning the return."}
]}
];
