r/brand second-hand chain (Comme, Margiela, Sacai, Hermès etc.) on 3 floors (B1–2F), 282 Enpukuji-mae-cho off Shinkyogoku/Rokkaku; 11:00–20:00; 3 Kyoto branches — this is the main one.", "src": "https://www.hk01.com/穿搭筆記/964133/日本京都酒店推介-日圓大跌-必逛hermès-rolex中古店-5星酒店"}, {"name": "SOU・SOU (Tabi / Hotei / Ise-momen cluster)", "g": "shop", "c": "shop", "city": "Kyoto", "lat": 35.0046, "lon": 135.7674, "note": "Kyoto textile brand's 10-shop village in one alley (Nakano-cho 565–583, Shinkyogoku Shijo-agaru): tabi shoes, Hotei bags, Ise cotton tenugui, wagashi café. Tabi & Hotei 12:00–20:00 closed Wed; Ise-momen 11:00–20:00 daily.", "src": "https://www.mapple.net/article/37945/"}, {"name": "Kyukyodo Kyoto Main Store", "g": "shop", "c": "shop", "city": "Kyoto", "lat": 35.0099, "lon": 135.767, "note": "Founded 1663: incense, washi stationery, calligraphy goods; 520 Shimohonnoji-mae-cho, Teramachi-Anekoji; 10:00–18:00; occasional temporary closures.", "src": "https://rurubu.jp/andmore/spot/80026401"}, {"name": "Ichizawa Shinzaburo Hanpu", "g": "shop", "c": "shop", "city": "Kyoto", "lat": 35.0078, "lon": 135.7776, "note": "Cult Kyoto canvas-bag maker, only store in the world; 602 Takabatake-cho on Higashioji north of Furumonzen (10 min walk from Celestine); 10:00–18:00; closed Tue (and Dec 30–Jan 3).", "src": "https://www.mapple.net/article/37945/"}, {"name": "Kaikado (tea caddies) Main Shop", "g": "shop", "c": "shop", "city": "Kyoto", "lat": 34.994, "lon": 135.7655, "note": "Since 1875, hand-made tin/copper/brass tea caddies (130 steps, from ~¥6,300); 84-1 Umeminato-cho, Kawaramachi-Rokujo; 9:00–18:00; closed Sun & public holidays.", "src": "https://www.jalan.net/kankou/spt_guide000000175831/"}, {"name": "Kaikado Café", "g": "coffee", "c": "coffee", "city": "Kyoto", "lat": 34.9901, "lon": 135.7643, "note": "Kaikado's café in a 1927 tram office: Nakagawa Wani coffee, Ippodo tea, cheesecake, served in Kaikado/Kanaami-tsuji/Asahiyaki ware; 352 Sumiyoshi-cho; weekdays 8:00–16:00 (LO 15:30), weekends/hols 8:00–17:00 (LO 16:30); check site for closures.", "src": "https://www.kaikado-cafe.jp/"}, {"name": "Aritsugu (Nishiki Market)", "g": "shop", "c": "shop", "city": "Kyoto", "lat": 35.0051, "lon": 135.7661, "note": "450-year-old knife shop (Nishikikoji west of Gokomachi), engraving while you wait; 10:00–16:30; closed Wed and Jan 1–4 — note the Wed closure and early close.", "src": "https://rurubu.jp/andmore/spot/80026377"}, {"name": "D&DEPARTMENT KYOTO", "g": "shop", "c": "shop", "city": "Kyoto", "lat": 35.0005, "lon": 135.7634, "note": "Long-life design/craft select shop + d食堂 inside Bukko-ji temple grounds, 397 Shinkai-cho; shop 11:00–18:00, restaurant 11:00–18:00 (LO 15:00); closed Wed.", "src": "https://rurubu.jp/andmore/spot/80090392"}, {"name": "Kyoto Okazaki Tsutaya Books", "g": "shop", "c": "shop", "city": "Kyoto", "lat": 35.0143, "lon": 135.7814, "note": "Design/art bookstore with Starbucks inside ROHM Theatre Kyoto Park Plaza 1F, 13 Okazaki Saishoji-cho; 8:00–22:00 per Mapple; good pre-/post-Philosopher's Path stop.", "src": "https://www.mapple.net/region/a0502010203_g02000000/spot/"}, {"name": "Kohchosai Kosuga Kyoto Main Store", "g": "ceramics", "c": "ceramics", "city": "Kyoto", "lat": 35.009, "lon": 135.7699, "note": "1898 bamboo craft house (baskets, cutlery, tableware), now at The Royal Park Hotel Kyoto Sanjo 1F, 74 Nakajima-cho; 11:00–19:00; open year-round per Mapple.", "src": "https://www.mapple.net/region/a0502010101_g02090000/spot/"}, {"name": "Asahido Main Store", "g": "ceramics", "c": "ceramics", "city": "Kyoto", "lat": 34.9953, "lon": 135.7822, "note": "Since 1870, biggest Kyo-/Kiyomizu-yaki range in Japan, right at Kiyomizu-dera gate (1-280 Kiyomizu); 2F gallery + Saryo Kiraku café; 9:30–18:00 (later on temple night-illumination days); open daily.", "src": "https://www.asahido.co.jp/en/shops/main-store/"}, {"name": "Kyoto Tojiki Kaikan (Kyoto Ceramic Center)", "g": "ceramics", "c": "ceramics", "city": "Kyoto", "lat": 34.9949, "lon": 135.7769, "note": "Kyoto Ceramic Association's gallery-shop at foot of Gojozaka: masters + young potters, rotating shows, daily live throwing; free; 10:00–18:00; closed Thu (open if holiday) & New Year.", "src": "https://kyototoujikikaikan.or.jp/kaikan/"}, {"name": "Sfera Building (Sfera Shop)", "g": "ceramics", "c": "ceramics", "city": "Kyoto", "lat": 35.0059, "lon": 135.7726, "note": "Claesson Koivisto Rune-designed building on Nawate/Shinbashi: modern Kyoto tableware & lifestyle goods (Sfera's own ceramics), exhibition space, Bar Satonaka; closed Wed; shop hours not posted (typically ~11:00–19:00, confirm).", "src": "https://www.shift.jp.org/guide/kyoto/bar-restaurant/sfera-building.html"}, {"name": "Dongree Coffee Stand & Crafts", "g": "coffee", "c": "coffee", "city": "Kyoto", "lat": 34.9965, "lon": 135.7724, "note": "Rokuhara coffee stand that also sells hand-made crafts/mingei tools; beans from 5 Kyoto roasters, hand-brewed per cup, tatami seating; 214-4 Ikedono-cho; 8:00–17:00; closed Tue.", "src": "https://kinarino.jp/cat8/35205"}, {"name": "Ippodo Tea Kyoto Main Store + Kaboku Tearoom", "g": "tea", "c": "tea", "city": "Kyoto", "lat": 35.014, "lon": 135.7674, "note": "Since 1717; shop + Kaboku tearoom where staff teach you to brew your own gyokuro/sencha/matcha (~30 blends, seasonal wagashi) — the de-facto 'tea class'; 52 Tokiwagi-cho; 10:00–17:00; closed 2nd Wed; main building was renovated 2023–24.", "src": "https://rurubu.jp/andmore/spot/80026570"}, {"name": "Marukyu Koyamaen Nishinotoin (Motoan tearoom)", "g": "tea", "c": "matcha", "city": "Kyoto", "lat": 35.0103, "lon": 135.7553, "note": "Uji matcha house's only Kyoto-city shop + 2-tatami tearoom Motoan: top-grade matcha, sweets, matcha ice; shop 9:30–18:00, tearoom 10:30–17:00 LO; closed Wed (open if holiday).", "src": "https://rurubu.jp/andmore/spot/80026552"}, {"name": "Gion Tsujiri / Saryo Tsujiri Gion Honten", "g": "tea", "c": "matcha", "city": "Kyoto", "lat": 35.0036, "lon": 135.774, "note": "Matcha shop (1F) + Saryo Tsujiri parfait café (2–3F), 573-3 Gionmachi Minamigawa on Shijo; 10:30–20:30 (LO 19:30) daily; ¥1,000–2,000; expect a queue.", "src": "https://tabelog.com/en/kyoto/A2601/A260301/26000408/"}, {"name": "Horaido Tea Shop", "g": "tea", "c": "tea", "city": "Kyoto", "lat": 35.0045, "lon": 135.7667, "note": "200+-year Uji tea shop that invented genmaicha; tiny, owner advises blends/teaware; 295 Higashi-Daimonji-cho, Teramachi Shijo-agaru; 10:30–19:00; closed on days of month ending in 2 or 7 (Dec 2, 7, 12…).", "src": "https://rurubu.jp/andmore/spot/80026390"}, {"name": "Gion Tokuya", "g": "sweets", "c": "sweets", "city": "Kyoto", "lat": 35.0025, "lon": 135.7749, "note": "Hanamikoji's famous hon-warabimochi/kuzumochi (combo plate ~¥1,420) in a quiet tatami room; 570-127 Gionmachi Minamigawa; 12:00–18:00 or until sold out; irregular closures.", "src": "https://rurubu.jp/andmore/spot/80026973"}, {"name": "Kagizen Yoshifusa Shijo Main Store", "g": "sweets", "c": "sweets", "city": "Kyoto", "lat": 35.004, "lon": 135.7748, "note": "Gion wagashi house (Edo era); kuzukiri with kuromitsu ¥1,400 (tearoom only), kikujutou wasanbon candies; 264 Gionmachi Kitagawa; shop 9:30–18:00, tearoom 10:00–18:00 (LO 17:30); closed Mon (Tue if Mon holiday).", "src": "https://rurubu.jp/andmore/spot/80026852"}, {"name": "Kasagiya", "g": "sweets", "c": "sweets", "city": "Kyoto", "lat": 34.9986, "lon": 135.7804, "note": "1914 sweets house on Ninenzaka (Yumeji Takehisa's haunt): ohagi, zenzai with charcoal-grilled mochi; 349 Masuya-cho; 10:00–17:00 (LO 16:40; Tabelog says 17:30); closed Tue; ~¥1,000.", "src": "https://rurubu.jp/andmore/spot/80026978"}, {"name": "Gion Komori", "g": "sweets", "c": "sweets", "city": "Kyoto", "lat": 35.006, "lon": 135.7738, "note": "Former ochaya by Shinbashi bridge over the Shirakawa: warabimochi parfait, Tamba-azuki zenzai, tatami seats; 61 Motoyoshi-cho; 11:00–19:00 (LO 18:30); closed Mon + 2 irregular Sundays/month.", "src": "https://rurubu.jp/andmore/spot/80026916"}, {"name": "% ARABICA Kyoto Higashiyama", "g": "coffee", "c": "coffee", "city": "Kyoto", "lat": 34.9986, "lon": 135.7783, "note": "The Yasaka-dori flagship with pagoda view, 87-5 Hoshino-cho — 3 min from Celestine; 9:00–18:00 daily (irregular closures); go at opening to beat the line.", "src": "https://rurubu.jp/andmore/spot/80095556"}, {"name": "WEEKENDERS COFFEE Shinmachi", "g": "coffee", "c": "coffee", "city": "Kyoto", "lat": 35.006, "lon": 135.7573, "note": "NEW: the Tominokoji machiya stand closed Apr 15 2026 and Weekenders reopened Sep 30 2026 in a 100-yr nagaya at 189 Ubayanagi-cho (Takoyakushi-dori, Shinmachi east); 7:30–17:00; closed Wed; beans to take home.", "src": "https://kansai-kaiten.com/weekenderscoffee-shinmachi2610/"}, {"name": "Walden Woods Kyoto", "g": "coffee", "c": "coffee", "city": "Kyoto", "lat": 34.9935, "lon": 135.7631, "note": "All-white 'forest' café with amphitheatre-style seating, house-roasted beans; 508-1 Sakae-cho; 9:00–18:00; closed days not posted (irregular).", "src": "https://www.walden-woods.com/"}, {"name": "WIFE&HUSBAND", "g": "coffee", "c": "coffee", "city": "Kyoto", "lat": 35.0435, "lon": 135.7614, "note": "Tiny antique-filled roastery café by the Kamo River; rent a picnic basket (thermos coffee, rusks, stools) for the riverbank; 106-6 Koyama Shimouchikawara-cho; 10:00–17:00; closed Sun, Mon, Thu — plan carefully.", "src": "https://hamoni.jp/en/shop/EVtXGP8nGnXISRdLYQXG"}, {"name": "Blue Bottle Coffee Kyoto Café", "g": "coffee", "c": "coffee", "city": "Kyoto", "lat": 35.0115, "lon": 135.7893, "note": "Two-building renovated machiya near Nanzen-ji, 64 Nanzenji Kusakawa-cho; 9:00–18:00 daily; natural stop between Okazaki and the Philosopher's Path.", "src": "https://store.bluebottlecoffee.jp/pages/kyoto"}, {"name": "Vermillion Café", "g": "coffee", "c": "coffee", "city": "Kyoto", "lat": 34.9682, "lon": 135.7743, "note": "Terrace café over a pond in the woods on the back side of Fushimi Inari (5-31 Fukakusa Kaitoguchi-cho): flat whites, brunch, matcha sweets; hours listed as 8:30–15:00 (another source 9:30–16:00) — go for a late breakfast; closed days not posted.", "src": "https://hamoni.jp/en/shop/8yIq39xsKn75YCTkgIir"}, {"name": "RABBIT BAGELS — green RABBIT BAGELS (Rokkaku)", "g": "sweets", "c": "bakery", "city": "Kyoto", "lat": 35.0073, "lon": 135.7646, "note": "Kyoto-born NY-style bagel brand (plain ¥250, everything ¥270, choc ¥290, 'sand' sandwiches); nearest of 6 Kyoto shops to Celestine (~1.2 km / 17 min walk) at 76 Daikoku-cho (Rokkaku-dori), 10:00–17:00; also Shijo-Shinmachi 9:00–19:00 (35.0039,135.7555) and the Kawaramachi-Marutamachi flagship with café 10:00–17:00 (35.0180,135.7693); closed days not listed (irregular).", "src": "https://rabbitbagels.jp/"}, {"name": "Bar Rocking Chair", "g": "bar", "c": "bar", "city": "Kyoto", "lat": 35.0006, "lon": 135.7664, "note": "Machiya cocktail bar of award-winning Kenji Tsubokura, 434-2 Tachibana-cho (Gokomachi Bukkoji-sagaru); table charge ¥880 incl. snack, ~¥3–4k pp; hours not posted on Tabelog (typically from 17:00, closed Mon — confirm).", "src": "https://ssl.tabelog.com/en/kyoto/A2601/A260201/26007698/"}, {"name": "Bee's Knees", "g": "bar", "c": "bar", "city": "Kyoto", "lat": 35.005, "lon": 135.7702, "note": "Speakeasy-style, Asia's 50 Best Bars regular (signature 'Astronaut', hojicha drinks), Matsuya Bldg 1F, 364 Kamiya-cho; 18:00–01:00 Mon–Thu, to 02:00 Fri–Sat; closed Sun; ¥3–5k pp; walk-ins.", "src": "https://www.nomunication.jp/2023/01/05/kyoto-drinking-guide/"}, {"name": "L'Escamoteur Bar", "g": "bar", "c": "bar", "city": "Kyoto", "lat": 35.0018, "lon": 135.7699, "note": "Steampunk 'magician's cabinet' cocktail bar (wasabi cocktail, sleight-of-hand), 2F, 138-9 Saito-cho, Saiseki-dori Shijo-sagaru; ~20:00–02:00; closed Thu (per user notes — confirm).", "src": "https://mapstr.com/place/LdyJRcEAXQg"}, {"name": "Gion Finlandia Bar", "g": "bar", "c": "bar", "city": "Kyoto", "lat": 35.0034, "lon": 135.7744, "note": "1982 shot bar in a former geisha house one alley west of Hanamikoji (570-123 Gionmachi Minamigawa): Nordic spirits, Iittala glass, no music; 18:00–02:00 (LO 01:30) daily; look for the 'finlandia' light box.", "src": "https://wanderlog.com/place/details/1002615/gion-finlandia-bar"}, {"name": "komorebino natural wine bar", "g": "bar", "c": "wine bar", "city": "Kyoto", "lat": 35.0043, "lon": 135.7748, "note": "Natural-wine bar/dining in Gion, Hanami Kaikan 1F, 123 Tominaga-cho; 17:00–24:00 (LO 23:00) daily; charge ¥700; ~¥6–8k pp; 4 min from Gion-Shijo, 10 min walk from Celestine.", "src": "https://tabelog.com/en/kyoto/A2601/A260301/26029688/"}, {"name": "Bar Ixey", "g": "bar", "c": "bar", "city": "Kyoto", "lat": 35.0059, "lon": 135.7728, "note": "3F 1920s-style bar on Nawate (Space Shinbashi 3F-East, 15 Benzaiten-cho): herbal-liqueur cocktails from the owner's own herb garden, rare bottles; 17:00–24:00 Mon–Sat; closed Sun.", "src": "https://wanderlog.com/place/details/3975074/bar-ixey"}, {"name": "BAR Kingdom", "g": "bar", "c": "bar", "city": "Kyoto", "lat": 35.0006, "lon": 135.7649, "note": "Classic-style bar (Ginza-trained bartender, opened 2020), 151 Sujiya-cho; 19:00–02:00 Tue–Sun; closed Mon; ~¥4–5k pp.", "src": "https://tabelog.com/en/kyoto/A2601/A260201/26035542"}, {"name": "Kumano Winehouse (Kuma's Wine House)", "g": "bar", "c": "wine bar", "city": "Kyoto", "lat": 35.0176, "lon": 135.777, "note": "Natural-wine bar/shop in an ex-secondhand bookstore (bottles on the old shelves, ~800 refs, glasses ~¥1,000), 41-8 Higashi-Maruta-cho; 16:00–24:00 (food LO 23:00); closed Sun & Mon; reserve.", "src": "https://brutus.jp/en/post-116978"}, {"name": "GINZA MUSIC BAR Kyoto", "g": "bar", "c": "record bar", "city": "Kyoto", "lat": 35.0029, "lon": 135.7704, "note": "Kyoto outpost of the Tokyo vinyl listening bar (50 seats, hi-fi, DJ sets), Murakami-ju Bldg 2F, 194 Sendo-cho, Shijo-Kiyamachi; 12:00–24:00; closed Mon.", "src": "https://openers.jp/en/lounge/lounge_music/Se1XX"}, {"name": "P.M. SOUNDS Kyoto", "g": "bar", "c": "record bar", "city": "Kyoto", "lat": 35.008, "lon": 135.7696, "note": "Intimate vinyl music bar (JBL, jazz to J-pop at conversation volume; craft beer, Japanese whisky), CT·BEACH Yamaguchi Bldg B1, 71-21 Daikoku-cho; 19:00–23:30 Mon–Sat; closed Sun; arrive early, fills up.", "src": "https://pmsounds.jp/"}, {"name": "Hello Dolly", "g": "bar", "c": "bar", "city": "Kyoto", "lat": 35.0055, "lon": 135.7712, "note": "Antique-filled jazz bar on Pontocho's riverside (161-2 Matsumoto-cho), live jazz most nights, moderately priced drinks; hours not posted online (generally evenings ~18:00–late) — confirm; good Pontocho finale.", "src": "https://wanderlog.com/place/details/479729"}, {"name": "Jazz Spot YAMATOYA", "g": "bar", "c": "record bar", "city": "Kyoto", "lat": 35.0174, "lon": 135.7788, "note": "1970 jazz kissa (Chick Corea, Keith Jarrett visited), vinyl 1930s–80s on big horns, serious coffee; Kumano-jinja crossing east, 2nd lane south (coords approx, town-level); 12:00–22:00 (LO 21:30); alcohol charge ¥600 after 19:00; closed Wed & Thu.", "src": "https://jazz-yamatoya.com/"}, {"name": "CICON Rooftop Bar (NOHGA Hotel Kiyomizu)", "g": "bar", "c": "bar", "city": "Kyoto", "lat": 34.9953, "lon": 135.7739, "note": "Open-air rooftop with fire pit and eastern-mountain night views, 450-1 Gojobashi-higashi 4-chome (12 min walk from Celestine); walk-ins OK; closes by midnight; ~¥3–5k pp; winter blankets — check seasonal opening.", "src": "https://joinpearl.co/bars/kyoto/cicon-rooftop-bar-by-nohga-hotel-kiyomizu-kyoto"}, {"name": "Juu-go (十五) soba", "g": "experience", "c": "experience", "city": "Kyoto", "lat": 35.0258, "lon": 135.7953, "note": "Michelin Bib Gourmand juwari soba from the owner's own buckwheat farm, 6 counter seats only, sobagaki & 'five steps' tasting; 71-6 Jodoji Kaminanda-cho, 7 min from Ginkakuji-michi; hours/closures irregular — check Instagram and arrive before opening.", "src": "https://wowith.com/areas/japan/kyoto/demachiyanagi/articles/juu_go"}, {"name": "glänta Kyoto Ninenzaka (ring-making)", "g": "experience", "c": "experience", "city": "Kyoto", "lat": 34.9982, "lon": 135.7817, "note": "Couple ring workshop 45–60 min, take home same day, free inner engraving: Silver925 ¥5,200 (2mm)–¥13,800 (7mm); 10K gold from ¥28,600; 18K from ¥53,500; 351-3 Masuya-cho (Kodaiji Minamimon-dori); 10:00–18:00; book online by the day before (same-day by phone 075-606-5775); 2nd Kyoto shop at Sanjo-Kawaramachi 87 Nakajima-cho (35.0088,135.7699).", "src": "https://www.kochentertainment.com/glanta/en/workshop/"}, {"name": "Akanece Kiyomizu (handmade wedding/pair rings)", "g": "experience", "c": "experience", "city": "Kyoto", "lat": 34.9982, "lon": 135.7777, "note": "Forged K18 gold or Pt900 ring-making, ~1.5 h (2 h door-to-door), from ¥16,500 fee + materials (K18 2mm total from ¥93,600; Pt 2mm from ¥76,000), options: hammer, milgrain, engraving; 94-2 Tsukinowa-cho; slots 10:15–16:55; irregular closures; book on asoview. Cheaper silver courses at Akanece Kyoto (Rokkaku, 10:45–19:00).", "src": "https://www.asoview.com/item/activity/pln3000033960/"}, {"name": "Gion Corner (Yasaka Hall)", "g": "experience", "c": "experience", "city": "Kyoto", "lat": 35.0014, "lon": 135.7755, "note": "50-min sampler of kyomai, tea ceremony, koto, kyogen, bugaku; WINTER SCHEDULE Dec 1–Mar 11: Tue–Fri only, 18:00 & 19:00 (so Tue Dec 1–Fri Dec 4 work); adult ¥5,500, premium ¥6,600, tea-and-sweets seat ¥6,050; maiko photo after winter show; buy online or at window.", "src": "https://www.kyoto-gioncorner.com/global/en.html"}, {"name": "Fushimi Sake Village (伏水酒蔵小路)", "g": "bar", "c": "wine bar", "city": "Kyoto", "lat": 34.9325, "lon": 135.7605, "note": "Long sake counter pouring 18 Fushimi breweries/120+ labels (tasting sets ~¥3,880–4,280 incl. food) plus 8 food stalls that deliver to your seat; 82-2 Hirano-cho between Otesuji & Nayamachi arcades; 11:00–22:00 (LO 21:00) per Kyoto city tourism, no fixe const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MODE_COLOR={walk:"var(--walk)",taxi:"var(--taxi)",train:"var(--train)",boat:"var(--boat)"};
const MODE_WORD={walk:"walk",taxi:"taxi",train:"train",boat:"boat",flight:"flight"};

function dayLinks(stops){const qs=stops.map(s=>s.q),out=[];let i=0;while(i<qs.length-1){const ch=qs.slice(i,Math.min(i+10,qs.length));let u="https://www.google.com/maps/dir/?api=1&origin="+encodeURIComponent(ch[0])+"&destination="+encodeURIComponent(ch[ch.length-1]);const w=ch.slice(1,-1);if(w.length)u+="&waypoints="+encodeURIComponent(w.join("|"));out.push(u);i+=9;}return out;}
function starSvg(color,size){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.4l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z" fill="${color}" stroke="var(--panel)" stroke-width="1.6" stroke-linejoin="round"/></svg>`;}
function distM(a,b){const R=6371000,t=Math.PI/180,dl=(b.lat-a.lat)*t,dn=(b.lon-a.lon)*t;const x=Math.sin(dl/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
function nearbyStars(stops,r){return STARS.map((s,i)=>({s,i,d:Math.min(...stops.map(p=>distM(p,s)))})).filter(x=>x.d<=r).sort((a,b)=>a.d-b.d);}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
function toast(m){let t=document.querySelector(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t);}t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>{t.hidden=true},2400);}

// Japan time
const MON={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
function jpNow(){const s=new Date().toLocaleString("en-US",{timeZone:"Asia/Tokyo",hour12:false});return new Date(s);}
function dayKey(d){const [,mo,da]=d.date.split(" ");return `${MON[mo]}-${+da}`;}
function todayIdx(){const n=jpNow();const k=`${n.getMonth()}-${n.getDate()}`;const i=DAYS.findIndex(d=>dayKey(d)===k&&n.getFullYear()===2026);return i;}
function parseT(t,prevMin){const m=/(\d{1,2}):(\d{2})\s*(AM|PM)?/i.exec(t||"");if(!m)return null;let h=+m[1],mi=+m[2];const ap=(m[3]||"").toUpperCase();if(ap==="PM"&&h<12)h+=12;if(ap==="AM"&&h===12)h=0;if(!ap){if(h<=6)h+=12;if(prevMin!=null&&h*60+mi<prevMin-120)h+=12;}return h*60+mi;}
function stopMins(d){let prev=null;return d.stops.map(s=>{const v=parseT(s.t,prev);if(v!=null)prev=v;return v;});}

// ---------- schematic map
function renderMap(stops){
  const W=360,pad=34,labelPad=96;
  const lats=stops.map(s=>s.lat),lons=stops.map(s=>s.lon);
  const minLat=Math.min(...lats),maxLat=Math.max(...lats),minLon=Math.min(...lons),maxLon=Math.max(...lons);
  const lat0=(minLat+maxLat)/2,kx=Math.cos(lat0*Math.PI/180);
  const dx=Math.max((maxLon-minLon)*kx,1e-4),dy=Math.max(maxLat-minLat,1e-4);
  const innerW=W-pad-labelPad;let scale=innerW/dx;let H=dy*scale+pad*2;const maxH=W*1.05,minH=W*.6;
  if(H>maxH){scale=(maxH-pad*2)/dy;H=maxH;} if(H<minH)H=minH;
  const usedW=dx*scale,usedH=dy*scale,ox=pad+(innerW-usedW)/2,oy=(H-usedH)/2;
  const P=s=>[ox+(s.lon-minLon)*kx*scale,oy+(maxLat-s.lat)*scale];
  const pts=stops.map(P);
  for(let i=1;i<pts.length;i++)for(let j=0;j<i;j++){if(Math.hypot(pts[i][0]-pts[j][0],pts[i][1]-pts[j][1])<6){pts[i][0]+=10;pts[i][1]+=8;}}
  let g=`<svg viewBox="0 0 ${W} ${Math.round(H)}" role="img" aria-label="Route sketch"><rect width="${W}" height="${Math.round(H)}" fill="var(--panel)"/>`;
  for(let x=20;x<W;x+=40)g+=`<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="var(--line)" stroke-width=".5" opacity=".5"/>`;
  for(let y=20;y<H;y+=40)g+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="var(--line)" stroke-width=".5" opacity=".5"/>`;
  nearbyStars(stops,650).forEach(({s})=>{const [x,y]=P(s);if(x<4||y<4||x>W-4||y>H-4)return;const col=(GROUPS[s.g]||["","#888"])[1];const sc=s.big?1.05:.5,of=12*sc;g+=`<g transform="translate(${(x-of).toFixed(1)},${(y-of).toFixed(1)}) scale(${sc})" opacity="${s.big?1:.9}"><path d="M12 2.6l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.4l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z" fill="${col}" stroke="var(--panel)" stroke-width="2" stroke-linejoin="round"/></g>`;});
  for(let i=0;i<stops.length-1;i++){const [m]=stops[i].leg||["walk",0];const [x1,y1]=pts[i],[x2,y2]=pts[i+1];const color=MODE_COLOR[m]||"var(--muted)";const dash=m==="walk"?' stroke-dasharray="5 4"':'';const w=(m==="train"||m==="boat")?4:3;
    if(m==="train")g+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--panel)" stroke-width="7" stroke-linecap="round"/>`;
    g+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${w}"${dash} stroke-linecap="round"/>`;
    if(m==="train")g+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--panel)" stroke-width="1.2" stroke-dasharray="6 6" stroke-linecap="round"/>`;}
  stops.forEach((s,i)=>{const [x,y]=pts[i];g+=`<a href="#stop${i}" data-jump="${i}"><circle cx="${x}" cy="${y}" r="11" fill="var(--accent)" stroke="var(--panel)" stroke-width="2"/><text x="${x}" y="${y+4}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="500" fill="#fff">${i+1}</text></a>`;
    const short=s.name.split(/[,(+→:]/)[0].trim().slice(0,24);const right=x<W-labelPad-10;const lx=right?x+15:x-15,anchor=right?"start":"end";const ly=y+4+((i%2)?10:-8);
    g+=`<text x="${lx}" y="${ly}" text-anchor="${anchor}" font-family="IBM Plex Sans, sans-serif" font-size="11" fill="var(--fg)" stroke="var(--panel)" stroke-width="3" paint-order="stroke" stroke-linejoin="round">${esc(short)}</text>`;});
  return g+`</svg>`;
}

function renderDay(){
  const d=DAYS[dayIdx]; const isToday=dayIdx===tIdx;
  let h=`<div class="hero"><p class="date">Day ${d.n} · ${esc(d.date)}${isToday?" · today":""}</p><h2>${esc(d.title)}</h2><p class="base">${esc(d.base)}</p></div>`;
  if(d.intro) h+=`<details class="plan intro"${ls("introOpen")==="0"?"":" open"} data-intro="1"><summary>About today's places</summary>${d.intro.map(p=>`<p>${esc(p)}</p>`).join("")}</details>`;
  if(d.flight){
    h+=`<div class="flight"><div><b>Outbound</b>${esc(d.flight.out)}</div><div><b>Landing</b>${esc(d.flight.land)}</div><div><b>Before you go</b>${esc(d.flight.before)}</div><div><b>On the plane</b>${esc(d.flight.inflight)}</div></div>`;
    $("s-day").innerHTML=h; return;
  }
  const mins=stopMins(d);
  if(isToday){
    const n=jpNow(), nowM=n.getHours()*60+n.getMinutes();
    let cur=-1; mins.forEach((m,i)=>{if(m!=null&&m<=nowM)cur=i;});
    const nxt=mins.findIndex((m,i)=>i>cur&&m!=null);
    if(cur<0&&nxt>=0) h+=`<div class="now"><span class="k">First up</span><span class="t">${esc(d.stops[nxt].name)}</span><span class="s">${esc(d.stops[nxt].t)}</span></div>`;
    else if(cur>=0) h+=`<div class="now"><span class="k">Now</span><span class="t">${esc(d.stops[cur].name)}</span><span class="s">${nxt>=0?`Next: ${esc(d.stops[nxt].name)} at ${esc(d.stops[nxt].t)}${geo.pos?" · "+fmtDist(distM(geo.pos,d.stops[nxt]))+" away":""}`:"Last stop of the day"}</span></div>`;
    d._cur=cur;
  } else d._cur=-1;
  if(d.note) h+=`<details class="plan"><summary>The day in one paragraph</summary><p>${esc(d.note)}</p></details>`;
  const links=dayLinks(d.stops);
  const hasL=typeof L!=="undefined";
  h+=`<div class="card">${hasL?`<div class="mapwrap${mapBig?" big":""}"><div id="lmap"></div></div>`:renderMap(d.stops)}<div class="foot"><span>${d.stops.length} stops · tap a pin</span><span style="display:flex;gap:6px;flex-wrap:wrap">${hasL?(clusters(d).length>1?clusters(d).map((c,i)=>`<button type="button" class="btn sm" data-cl="${i}" aria-pressed="false">Stops ${c[0]+1}–${c[c.length-1]+1}</button>`).join(""):`<button type="button" class="btn sm" data-fit="1">Fit route</button>`)+`<button type="button" class="btn sm" data-big="1">${mapBig?"Smaller":"Bigger"}</button><button type="button" class="btn sm loc${geo.follow?" on":""}" data-loc="1" aria-pressed="${geo.follow}">${geo.denied?"Location off":geo.pos?(geo.follow?"Following":"Locate"):"Locate"}</button>`:""}${links.map((u,i)=>`<a class="btn sm" href="${u}" target="_blank" rel="noopener">Day${links.length>1?" "+(i+1):""} in Google Maps</a>`).join(" ")}</span></div></div>`;
  h+=`<div class="offrow"><button type="button" class="btn sm" id="off-btn" data-offline="${ls('hm-offline-all')==='1'?'all':'day'}">${ls('hm-offline-all')==='1'?'Maps saved for the whole trip ✓':(ls('hm-offline-'+d.n)==='1'?'Maps saved for today ✓':'Save today\'s maps offline')}</button>${ls('hm-offline-all')==='1'?'':'<button type="button" class="btn sm ghost" data-offline="all">Whole trip</button>'}</div>`;
  h+=`<ol class="tl">`;
  d.stops.forEach((s,i)=>{
    const done=ls(doneKey(i))==="1"; const cur=i===d._cur;
    const leg=s.leg; const lineCls=leg?leg[0]:"";
    h+=`<li class="stop${done?" done":""}${cur?" current":""}" id="stop${i}"><div class="spine"><div class="n">${i+1}</div>${i<d.stops.length-1?`<div class="line ${lineCls}"></div>`:""}</div>
      <div><div class="stopcard" role="button" tabindex="0" data-i="${i}" aria-expanded="false">
        <div class="head"><div style="min-width:0;flex:1"><div class="ttl">${esc(s.name)}${s.stamp?` <span class="pill">印</span>`:""}</div>
        <div class="meta"><span class="t">${esc(s.t)}</span>${s.stay?`<span>${esc(s.stay)}</span>`:""}</div></div>
        <button type="button" class="tick" data-tick="${i}" aria-pressed="${done}" aria-label="Mark done">${done?"済":""}</button></div>
        <div class="more">${s.note?`<p>${esc(s.note)}</p>`:""}${s.near?`<p class="near">Nearby: ${esc(s.near)}</p>`:""}${s.stamp?`<p class="stamp"><b>印</b><span>${esc(s.stamp)}</span></p>`:""}
        <div class="acts"><a class="btn sm primary" href="${adir(s.q)}" target="_blank" rel="noopener">Directions</a><a class="btn sm" href="${amaps(s.q)}" target="_blank" rel="noopener">Apple Maps</a><a class="btn sm" href="${gmaps(s.q)}" target="_blank" rel="noopener">Google Maps</a></div></div></div>
      ${leg?`<div class="leg">↓ ${leg[1]?leg[1]+" min ":""}${MODE_WORD[leg[0]]||leg[0]}</div>`:""}</div></li>`;
  });
  h+=`</ol>`;
  $("s-day").innerHTML=h;
  if(hasL) initMap(d);
}
let lmap=null, mapBig=false;
function initMap(d){
  const el=$("lmap"); if(!el) return;
  if(lmap){ lmap.remove(); lmap=null; }
  lmap=L.map(el,{zoomControl:true,attributionControl:false,tap:false}); L.control.attribution({prefix:false}).addTo(lmap);
  L.tileLayer(TILE_URL,{minZoom:9,maxZoom:19,maxNativeZoom:19,attribution:"© OpenStreetMap contributors",crossOrigin:true,errorTileUrl:"data:image/gif;base64,R0lGODlhAQABAIAAAOjk2gAAACH5BAAAAAAALAAAAAABAAEAAAICRAEAOw=="}).addTo(lmap);
  lmap.on("moveend",()=>{if(geo.follow&&!geo.programmatic)setFollow(false);});
  geo.me=null; geo.ring=null; drawMe();
  const pts=d.stops.map(s=>[s.lat,s.lon]);
  for(let i=0;i<d.stops.length-1;i++){const [m]=d.stops[i].leg||["walk",0];const col={walk:"#24305e",taxi:"#b08a2e",train:"#2d7f6a",boat:"#2a6f9e"}[m]||"#777";
    L.polyline([pts[i],pts[i+1]],{color:"#fff",weight:7,opacity:.9}).addTo(lmap);
    L.polyline([pts[i],pts[i+1]],{color:col,weight:4,opacity:.95,dashArray:m==="walk"?"6 6":null}).addTo(lmap);}
  nearbyStars(d.stops,700).forEach(({s,d:dist})=>{const col=(GROUPS[s.g]||["","#888"])[1];const sz=s.big?30:(s.g==="seven"?20:16);
    L.marker([s.lat,s.lon],{icon:L.divIcon({className:"",html:`<div class="spin">${starSvg(col,sz)}</div>`,iconSize:[sz,sz],iconAnchor:[sz/2,sz/2],popupAnchor:[0,-sz/2]}),zIndexOffset:s.big?500:0}).addTo(lmap)
     .bindPopup(`<div class="lp"><b>★ ${esc(s.name)}</b><span class="m">${esc(s.c)} · ${Math.max(1,Math.round(dist/80))} min from the route</span><div style="font-size:12.5px;margin-top:4px">${esc(s.note)}</div><div class="a"><a class="p" href="${adir(s.name+" "+s.city)}" target="_blank" rel="noopener">Directions</a><a href="${gmaps(s.name+" "+s.city)}" target="_blank" rel="noopener">Google</a></div></div>`,{maxWidth:250});});
  d.stops.forEach((s,i)=>{const done=ls(doneKey(i))==="1";const cls="pin"+(i===d._cur?" cur":"")+(done?" done":"");
    L.marker([s.lat,s.lon],{icon:L.divIcon({className:"",html:`<div class="${cls}">${i+1}</div>`,iconSize:[26,26],iconAnchor:[13,13],popupAnchor:[0,-14]}),zIndexOffset:1000}).addTo(lmap)
     .bindPopup(`<div class="lp"><b>${i+1}. ${esc(s.name)}</b><span class="m">${esc(s.t)}${s.stay?" · "+esc(s.stay):""}</span><div class="a"><a class="p" href="${adir(s.q)}" target="_blank" rel="noopener">Directions</a><a href="#stop${i}" data-jump="${i}">Details</a></div></div>`,{maxWidth:250});});
  fitRoute(d);
}
function clusters(d){const out=[];let cur=[0];for(let i=1;i<d.stops.length;i++){if(distM(d.stops[i-1],d.stops[i])>15000){out.push(cur);cur=[];}cur.push(i);}out.push(cur);return out;}
function fitRoute(d,ci){ if(!lmap) return; const cl=clusters(d); let pick=ci; if(pick==null){pick=0; if(d._cur>=0){pick=cl.findIndex(c=>c.includes(d._cur));} else {let best=0;cl.forEach((c,i)=>{if(c.length>cl[best].length)best=i;});pick=best;}}
  const idx=cl[pick]||cl[0]; const b=L.latLngBounds(idx.map(i=>[d.stops[i].lat,d.stops[i].lon])); lmap.fitBounds(b,{padding:[28,28],maxZoom:16});
  document.querySelectorAll("[data-cl]").forEach(x=>x.setAttribute("aria-pressed",+x.dataset.cl===pick?"true":"false")); }

function renderFinds(){
  const d=DAYS[dayIdx]; const city=d.stops?(d.stops[0].q.match(/Kyoto|Hakone/)?(d.stops[0].q.match(/Kyoto/)?"Kyoto":"Hakone"):"Tokyo"):"Tokyo";
  let list=d.stops&&!findAll?nearbyStars(d.stops,650):STARS.map((s,i)=>({s,i,d:d.stops?Math.min(...d.stops.map(p=>distM(p,s))):0})).filter(x=>x.s.city===city).sort((a,b)=>a.d-b.d);
  if(findGroup!=="all") list=list.filter(x=>x.s.g===findGroup);
  const groupsPresent=Object.keys(GROUPS).filter(g=>STARS.some(s=>s.g===g&&(findAll?s.city===city:true)));
  let h=`<h3 class="sec">Finds</h3><p class="lead">${findAll?`Everything we starred in ${esc(city)}.`:`Shops, cafés, bars and bites within a few minutes of today's stops.`}</p>`;
  h+=`<div class="chips"><button type="button" class="chip" data-all="1" aria-pressed="${findAll}">All of ${esc(city)}</button></div>`;
  h+=`<div class="chips"><button type="button" class="chip" data-g="all" aria-pressed="${findGroup==="all"}">Everything</button>${groupsPresent.map(g=>`<button type="button" class="chip" data-g="${g}" aria-pressed="${findGroup===g}">${starSvg(GROUPS[g][1],13)}${esc(GROUPS[g][0])}</button>`).join("")}</div>`;
  if(!list.length) h+=`<p class="lead">Nothing in this group near today's route. Try "All of ${esc(city)}".</p>`;
  h+=`<ul class="finds">`+list.map(({s,d:dist})=>`<li>${starSvg((GROUPS[s.g]||["","#888"])[1],18)}<div><strong>${esc(s.name)}</strong> <span class="fc">${esc(s.c)}${d.stops?` · ${Math.max(1,Math.round(dist/80))} min from the route`:""}</span><div class="fn">${esc(s.note)}</div><div class="acts"><a class="btn sm primary" href="${adir(s.name+" "+s.city)}" target="_blank" rel="noopener">Directions</a><a class="btn sm" href="${gmaps(s.name+" "+s.city)}" target="_blank" rel="noopener">Google Maps</a></div></div></li>`).join("")+`</ul>`;
  $("s-finds").innerHTML=h;
}

function renderBook(){
  let h=`<h3 class="sec">Bookings</h3><p class="lead">Confirmation numbers and phone numbers, in trip order. Numbers are selectable; tap-and-hold to copy. Live checklist: the Honeymoon Bookings page.</p><ul class="bk">`;
  h+=BOOKINGS.map(b=>`<li><div class="d">${esc(b.d)}</div><div class="w">${esc(b.w)}</div><div class="c">${esc(b.c)}</div>${b.x?`<div class="x">${esc(b.x)}</div>`:""}${b.todo?`<div class="todo">STILL TO DO</div>`:""}</li>`).join("");
  $("s-book").innerHTML=h+`</ul>`;
}

function renderCard(){
  let h=`<h3 class="sec">Allergy card</h3><p class="lead">Show this to staff at every restaurant.</p>
  <div class="bigcard"><div class="jp">木の実（ナッツ類）アレルギーがあります。<br>くるみ・アーモンド・カシューナッツ・ピスタチオ・ヘーゼルナッツ・松の実・栗・銀杏が入っていない料理をお願いします。</div><div class="en">I have a tree-nut allergy. Please serve dishes without walnut, almond, cashew, pistachio, hazelnut, pine nut, chestnut or ginkgo.</div></div>
  <h3 class="sec">Show the taxi driver</h3><p class="lead">Japanese names and addresses for the places you'll be dropped at.</p>`;
  h+=ADDR.map(([en,jp,sub])=>`<div class="addr"><b>${esc(en)}</b><div class="jp">${esc(jp)}</div><div class="en">${esc(sub)}</div></div>`).join("");
  h+=`<h3 class="sec">Useful phrases</h3>`;
  [["Sumimasen","Excuse me / sorry"],["Futari desu","Two people"],["Yoyaku shiteimasu, Williamson desu","We have a reservation, Williamson"],["Okaikei onegaishimasu","The bill, please"],["Kādo de ii desu ka?","Can I pay by card?"],["Eigo no menyū arimasu ka?","Is there an English menu?"],["Koko made onegaishimasu (show address)","To here, please"],["Wasabi nuki de","Without wasabi"]].forEach(([j,e])=>{h+=`<div class="addr"><b>${esc(j)}</b><div class="en">${esc(e)}</div></div>`;});
  h+=`<h3 class="sec">Emergency</h3><div class="addr"><b>110 police · 119 ambulance and fire</b><div class="en">Japan Visitor Hotline (JNTO, English, 24 h): 050-3816-2787</div></div>`;
  $("s-card").innerHTML=h;
}

function show(){
  ["day","finds","book","card"].forEach(k=>{$("s-"+k).hidden=k!==tab;});
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.tab===tab?"true":"false"));
  $("rail").style.display=(tab==="day"||tab==="finds")?"flex":"none";
  if(tab==="day")renderDay(); if(tab==="finds")renderFinds(); if(tab==="book")renderBook(); if(tab==="card")renderCard();
  $("h1").textContent=tab==="day"||tab==="finds"?DAYS[dayIdx].title:(tab==="book"?"Bookings":"Cards");
  $("main").scrollTop=0;
}
function setDay(i){dayIdx=Math.max(0,Math.min(DAYS.length-1,i));ls("hm-day",String(dayIdx));renderRail();show();}

// ---------- events
document.addEventListener("click",ev=>{
  const tb=ev.target.closest(".tabs button"); if(tb){tab=tb.dataset.tab;ls("hm-tab",tab);show();return;}
  const rb=ev.target.closest(".rail button"); if(rb){setDay(+rb.dataset.day);return;}
  const tk=ev.target.closest("[data-tick]"); if(tk){ev.stopPropagation();const i=+tk.dataset.tick;const v=ls(doneKey(i))==="1"?"0":"1";ls(doneKey(i),v);renderDay();if(v==="1")toast("Stamped 済");return;}
  if(ev.target.closest("[data-fit]")){fitRoute(DAYS[dayIdx]);return;}
  const clb=ev.target.closest("[data-cl]"); if(clb){fitRoute(DAYS[dayIdx],+clb.dataset.cl);return;}
  if(ev.target.closest("details[data-intro] summary")){setTimeout(()=>{const dd=document.querySelector("details[data-intro]");if(dd)ls("introOpen",dd.open?"1":"0");},0);return;}
  if(ev.target.closest("[data-big]")){mapBig=!mapBig;const w=document.querySelector(".mapwrap");if(w){w.classList.toggle("big",mapBig);ev.target.textContent=mapBig?"Smaller":"Bigger";setTimeout(()=>{if(lmap){lmap.invalidateSize();fitRoute(DAYS[dayIdx]);}},280);}return;}
  const jp=ev.target.closest("[data-jump]"); if(jp){ev.preventDefault();if(lmap)lmap.closePopup();const el=$("stop"+jp.dataset.jump);if(el){el.scrollIntoView({block:"center"});const c=el.querySelector(".stopcard");c.classList.add("open");c.setAttribute("aria-expanded","true");}return;}
  if(ev.target.closest("a")) return;
  const sc=ev.target.closest(".stopcard"); if(sc){sc.classList.toggle("open");sc.setAttribute("aria-expanded",sc.classList.contains("open"));return;}
  const ch=ev.target.closest(".chip"); if(ch){if(ch.dataset.all){findAll=!findAll;}else{findGroup=ch.dataset.g;}renderFinds();return;}
});
document.addEventListener("keydown",ev=>{if((ev.key==="Enter"||ev.key===" ")&&ev.target.classList&&ev.target.classList.contains("stopcard")){ev.preventDefault();ev.target.click();}});
// swipe between days on the Day screen
let sx=0,sy=0,st=0;
$("main").addEventListener("touchstart",e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;st=e.target.closest&&e.target.closest("#lmap")?0:Date.now();},{passive:true});
$("main").addEventListener("touchend",e=>{if(tab!=="day"&&tab!=="finds")return;const t=e.changedTouches[0];const dx=t.clientX-sx,dy=t.clientY-sy;if(st&&Date.now()-st<600&&Math.abs(dx)>70&&Math.abs(dy)<50){setDay(dayIdx+(dx<0?1:-1));}},{passive:true});

fmtClock(); setInterval(()=>{fmtClock(); if(tab==="day"&&dayIdx===tIdx&&!document.querySelector(".stopcard.open")&&!(lmap&&lmap._popup)) renderDay();},60000);
renderRail(); show();

// ---------- hosted-app extras: location, offline maps, install, PIN
const TILE_URL="https://tile.openstreetmap.org/{z}/{x}/{y}.png";
const geo={pos:null,acc:0,watch:null,follow:ls("hm-follow")==="1",denied:false,programmatic:false,me:null,ring:null};
function fmtDist(m){return m<950?Math.round(m/10)*10+" m":(m/1000).toFixed(1)+" km";}
function drawMe(){ if(!lmap||!geo.pos) return; const ll=[geo.pos.lat,geo.pos.lon];
  if(!geo.me){ geo.ring=L.circle(ll,{radius:geo.acc,color:"#1a73e8",weight:1,opacity:.5,fillColor:"#1a73e8",fillOpacity:.12,interactive:false}).addTo(lmap);
    geo.me=L.marker(ll,{icon:L.divIcon({className:"",html:'<div class="me"></div>',iconSize:[18,18],iconAnchor:[9,9]}),zIndexOffset:2000,interactive:false}).addTo(lmap); }
  else { geo.me.setLatLng(ll); geo.ring.setLatLng(ll); geo.ring.setRadius(geo.acc); }
  if(geo.follow){ geo.programmatic=true; lmap.panTo(ll,{animate:false}); setTimeout(()=>geo.programmatic=false,300); } }
function onPos(p){ geo.pos={lat:p.coords.latitude,lon:p.coords.longitude}; geo.acc=p.coords.accuracy||30; geo.denied=false;
  drawMe();
  const nowS=document.querySelector(".now .s"); if(nowS){ const d=DAYS[dayIdx]; const i=d.stops?d.stops.findIndex((s,j)=>j>d._cur):-1; if(i>=0&&d._cur>=0){ const base=nowS.textContent.replace(/ · [\d.,]+ (m|km) away$/,""); nowS.textContent=base+" · "+fmtDist(distM(geo.pos,d.stops[i]))+" away"; } } }
function onErr(e){ if(e.code===1){ geo.denied=true; setFollow(false); const b=document.querySelector("[data-loc]"); if(b){b.textContent="Location off";} toast("Location is off for this app. Settings → Safari → Location, or Settings → Privacy → Location Services."); } }
function startGeo(){ if(!navigator.geolocation){ toast("No location on this device."); return; } if(geo.watch!=null) return;
  geo.watch=navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:5000,timeout:20000}); }
function setFollow(v){ geo.follow=v; ls("hm-follow",v?"1":"0"); const b=document.querySelector("[data-loc]"); if(b){ b.classList.toggle("on",v); b.setAttribute("aria-pressed",v?"true":"false"); b.textContent=geo.denied?"Location off":(v?"Following":"Locate"); } if(v) drawMe(); }
function toast(msg){ let el=$("toast"); if(!el){ el=document.createElement("div"); el.id="toast"; el.className="toast"; document.body.appendChild(el); } el.textContent=msg; el.classList.add("show"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("show"),4200); }
document.addEventListener("click",ev=>{ const b=ev.target.closest("[data-loc]"); if(!b) return; ev.stopPropagation();
  if(geo.denied){ toast("Location is off for this app. Allow it in Settings, then reopen."); return; }
  startGeo(); if(!geo.pos){ setFollow(true); toast("Finding you…"); return; }
  if(geo.follow){ setFollow(false); } else { setFollow(true); } },true);
if(geo.follow&&ls("hm-unlocked")==="1") startGeo();

// ---------- offline tile saver
function tileXY(lat,lon,z){ const n=2**z; const x=Math.floor((lon+180)/360*n); const la=lat*Math.PI/180; const y=Math.floor((1-Math.log(Math.tan(la)+1/Math.cos(la))/Math.PI)/2*n); return [x,y]; }
function tilesAround(stops){ const set=new Set(); const plan=[[13,2500],[14,1600],[15,1000],[16,600],[17,400]];
  stops.forEach(s=>{ plan.forEach(([z,r])=>{ const mPerTile=40075016.686*Math.cos(s.lat*Math.PI/180)/2**z; const k=Math.ceil(r/mPerTile); const [cx,cy]=tileXY(s.lat,s.lon,z);
    for(let x=cx-k;x<=cx+k;x++) for(let y=cy-k;y<=cy+k;y++) set.add(`${z}/${x}/${y}`); }); });
  return [...set]; }
async function saveOffline(all){ const stops=all?DAYS.flatMap(d=>d.stops||[]):(DAYS[dayIdx].stops||[]); const list=tilesAround(stops);
  const cache=await caches.open("hm-tiles-v1"); const btn=$("off-btn"); let done=0,skipped=0; const total=list.length;
  const upd=()=>{ if(btn) btn.textContent=`Saving maps… ${Math.round((done+skipped)/total*100)}%`; };
  if(btn){ btn.disabled=true; } upd();
  const q=list.slice(); const worker=async()=>{ while(q.length){ const k=q.shift(); const url=TILE_URL.replace("{z}/{x}/{y}",k); try{ if(await cache.match(url)){skipped++;upd();continue;} const r=await fetch(url,{mode:"cors"}); if(r.ok) await cache.put(url,r.clone()); }catch(e){} done++; if(done%10===0) upd(); } };
  await Promise.all([worker(),worker(),worker(),worker()]);
  if(btn){ btn.disabled=false; btn.textContent=all?"Maps saved for the whole trip ✓":"Maps saved for today ✓"; } ls("hm-offline-"+(all?"all":DAYS[dayIdx].n),"1"); toast(`${total} map tiles saved on this phone.`); }
document.addEventListener("click",ev=>{ const b=ev.target.closest("[data-offline]"); if(!b) return; ev.stopPropagation(); saveOffline(b.dataset.offline==="all"); },true);

// ---------- service worker + install hint
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
const standalone=window.navigator.standalone===true||matchMedia("(display-mode: standalone)").matches;

// ---------- PIN gate (keeps casual visitors out; it's not encryption)
(function(){ if(ls("hm-unlocked")==="1") return; const g=document.createElement("div"); g.id="gate"; g.innerHTML=`<div class="gbox"><p class="gk">HONEYMOON DAY GUIDE</p><h2>Enter the code</h2><p class="gs">Four digits.</p><input id="gpin" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code" aria-label="Code"><p class="gerr" id="gerr"></p></div>`; document.body.appendChild(g);
  const inp=g.querySelector("#gpin"); inp.addEventListener("input",()=>{ if(inp.value.length===4){ if(inp.value==="1124"){ ls("hm-unlocked","1"); g.remove(); if(geo.follow) startGeo(); } else { $("gerr").textContent="Not it. Try again."; inp.value=""; } } }); setTimeout(()=>inp.focus(),300); })();
</script>
