<meta name="mobile-web-app-capable" content="yes">

<body>
<title>Honeymoon Day Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen phone app. Sticky day rail on top, scrolling day view, fixed bottom tabs (Day · Finds · Bookings · Card). */
:root{
  --bg:#f4f2ec; --panel:#ffffff; --fg:#1d2230; --muted:#6b7280; --line:#dcd8cf; --soft:#ebe8e0;
  --ink:#24305e; --accent:#c8402a; --accent-soft:#fbe7e2;
  --walk:#24305e; --taxi:#b08a2e; --train:#2d7f6a; --boat:#2a6f9e;
  --now:#1f8a8a; --now-soft:#dff1f1;
  --display:"Shippori Mincho",Georgia,"Times New Roman",serif;
  --body:"IBM Plex Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121419;--panel:#1c1f26;--fg:#ebe8e0;--muted:#9aa0ad;--line:#30353f;--soft:#242830;
  --ink:#aeb8ee;--accent:#ee6a4f;--accent-soft:#3a241f;--walk:#aeb8ee;--taxi:#d9b45a;--train:#6cc3a8;--boat:#6fb3dd;
  --now:#5fc3c3;--now-soft:#1c3a3a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121419;--panel:#1c1f26;--fg:#ebe8e0;--muted:#9aa0ad;--line:#30353f;--soft:#242830;
  --ink:#aeb8ee;--accent:#ee6a4f;--accent-soft:#3a241f;--walk:#aeb8ee;--taxi:#d9b45a;--train:#6cc3a8;--boat:#6fb3dd;
  --now:#5fc3c3;--now-soft:#1c3a3a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;overscroll-behavior:none}
.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
/* top */
.top{flex:0 0 auto;background:var(--bg);border-bottom:1px solid var(--line);padding-left:var(--gl);padding-right:var(--gr);padding-block:10px 8px}
.top .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.top h1{font-family:var(--display);font-weight:800;font-size:21px;margin:0;color:var(--ink);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.clock b{color:var(--fg);font-weight:500}
.rail{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:10px 0 0;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.rail button{flex:0 0 auto;min-width:50px;padding:6px 8px;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--fg);font-family:var(--mono);font-size:11px;line-height:1.15;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
.rail button b{font-size:15px;font-weight:500;color:var(--ink)}
.rail button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.rail button[aria-pressed="true"] b{color:var(--bg)}
.rail button.today{border-color:var(--accent)}
.rail button:focus-visible,.tabs button:focus-visible,.btn:focus-visible,.chip:focus-visible,.stopcard:focus-visible,.tick:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* main */
.main{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-left:var(--gl);padding-right:var(--gr);padding-block:14px 28px}
.screen[hidden]{display:none}
.hero{margin:0 0 12px}
.hero .date{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.hero h2{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.15;margin:0;color:var(--ink);text-wrap:balance}
.hero .base{margin:6px 0 0;color:var(--muted);font-size:13px}
.now{margin:12px 0;padding:12px 14px;border-radius:14px;background:var(--now-soft);border:1px solid color-mix(in srgb,var(--now) 40%,transparent);display:grid;gap:3px}
.now .k{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--now)}
.now .t{font-weight:600;font-size:16px}
.now .s{font-size:13px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:12px 0}
.card .foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.card svg{display:block;width:100%;height:auto}
details.plan{margin:0 0 12px;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:10px 14px;font-size:14px}
details.plan summary{cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--ink);letter-spacing:.03em;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.plan summary::-webkit-details-marker{display:none}
details.plan summary::after{content:"+";font-size:16px;color:var(--muted)}
details.plan[open] summary::after{content:"–"}
details.plan p{margin:8px 0 2px;max-width:60ch}
details.plan.intro p{line-height:1.5}details.plan.intro p+p{margin-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 13px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:500 14px var(--body);text-decoration:none;cursor:pointer;min-height:40px}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.sm{padding:6px 10px;min-height:34px;font-size:13px}
.btn[aria-pressed="true"]{background:var(--soft);border-color:var(--fg)}
.flight{display:grid;gap:8px;margin:12px 0}
.flight div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.flight b{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
/* timeline */
.tl{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:0}
.stop{display:grid;grid-template-columns:38px minmax(0,1fr);gap:0 10px;position:relative}
.stop .spine{display:flex;flex-direction:column;align-items:center}
.stop .n{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-family:var(--mono);font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-top:12px;border:2px solid var(--bg)}
.stop.done .n{background:var(--muted)}
.stop.current .n{background:var(--now);box-shadow:0 0 0 4px var(--now-soft)}
.stop .line{flex:1 1 auto;width:3px;margin:4px 0;border-left:3px solid var(--walk);min-height:16px}
.stop .line.walk{border-left-style:dashed}
.stop .line.taxi{border-color:var(--taxi)}
.stop .line.train{border-color:var(--train);width:4px;border-left-width:4px}
.stop .line.boat{border-color:var(--boat);border-left-style:double;border-left-width:4px}
.stop .line.flight{border-color:var(--muted);border-left-style:dotted}
.stopcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin:6px 0;cursor:pointer}
.stop.current .stopcard{border-color:var(--now)}
.stop.done .stopcard{opacity:.62}
.stopcard .head{display:flex;gap:8px;align-items:flex-start}
.stopcard .ttl{font-weight:600;font-size:15.5px;line-height:1.3;flex:1 1 auto;min-width:0}
.stop.done .ttl{text-decoration:line-through;text-decoration-color:var(--line)}
.stopcard .meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.stopcard .meta .t{color:var(--ink)}
.stopcard .pill{font-family:var(--mono);font-size:10px;padding:1px 6px;border:1.5px solid var(--accent);border-radius:4px;color:var(--accent);font-weight:700;font-family:var(--display)}
.tick{flex:0 0 auto;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);background:transparent;color:var(--accent);font-family:var(--display);font-weight:800;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.stop.done .tick{border-color:var(--accent);background:var(--accent-soft)}
.stopcard .more{display:none;margin-top:8px;font-size:14px;color:var(--fg)}
.stopcard.open .more{display:block}
.stopcard .more p{margin:0 0 6px;max-width:60ch}
.stopcard .near{color:var(--muted);font-size:13px}
.stopcard .stamp{display:flex;gap:8px;font-size:13px}
.stopcard .stamp b{flex:0 0 auto;color:var(--accent);font-family:var(--display)}
.stopcard .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.leg{font-family:var(--mono);font-size:11.5px;color:var(--muted);padding:0 0 6px 2px}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:500 12.5px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--soft);border-color:var(--fg)}
.chip svg{flex:0 0 auto}
.finds{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.finds li{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:18px minmax(0,1fr);gap:0 10px}
.finds li strong{font-size:15px}
.finds .fc{font-family:var(--mono);font-size:11px;color:var(--muted)}
.finds .fn{font-size:13px;color:var(--muted);margin:3px 0 6px}
.finds .acts{display:flex;gap:8px}
h3.sec{font-family:var(--display);font-size:19px;font-weight:700;color:var(--ink);margin:18px 0 6px}
p.lead{margin:0 0 8px;color:var(--muted);font-size:13.5px;max-width:60ch}
/* bookings */
.bk{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.bk li{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.bk .d{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bk .w{font-weight:600;font-size:15px;margin:2px 0}
.bk .c{font-family:var(--mono);font-size:13px;color:var(--ink);user-select:all;-webkit-user-select:all}
.bk .x{font-size:13px;color:var(--muted);margin-top:3px}
.bk .todo{color:var(--accent);font-family:var(--mono);font-size:11px}
/* card */
.bigcard{background:var(--panel);border:2.5px solid var(--accent);border-radius:18px;padding:18px 16px;margin:10px 0}
.bigcard .jp{font-size:24px;line-height:1.5;font-weight:600;color:var(--fg)}
.bigcard .en{margin:10px 0 0;color:var(--muted);font-size:14px}
.addr{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0}
.addr b{display:block;font-size:14px;margin-bottom:2px}
.addr .jp{font-size:19px;line-height:1.5;user-select:all;-webkit-user-select:all}
.addr .en{font-size:13px;color:var(--muted)}
/* tabs */
.tabs{flex:0 0 auto;display:flex;border-top:1px solid var(--line);background:var(--panel);padding-left:var(--gl);padding-right:var(--gr)}
.tabs button{flex:1 1 0;min-width:0;padding:8px 2px 7px;border:0;background:transparent;color:var(--muted);font:500 11px var(--body);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-pressed="true"]{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13.5px;max-width:min(90vw,420px);z-index:20}
@media (prefers-reduced-motion:no-preference){.main{scroll-behavior:smooth}}

.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-interactive{cursor:pointer}.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab,.leaflet-dragging .leaflet-interactive{cursor:grabbing}
.leaflet-marker-icon.leaflet-interactive,.leaflet-image-layer.leaflet-interactive,.leaflet-pane>svg path.leaflet-interactive,svg.leaflet-image-layer.leaflet-interactive path{pointer-events:visiblePainted;pointer-events:auto}
.leaflet-container a{color:var(--ink)}
.leaflet-bar{box-shadow:0 1px 5px rgba(0,0,0,.4);border-radius:8px;overflow:hidden}
.leaflet-bar a{background:var(--panel);color:var(--fg);border-bottom:1px solid var(--line);width:34px;height:34px;line-height:34px;display:block;text-align:center;text-decoration:none;font:bold 20px var(--mono)}
.leaflet-bar a:last-child{border-bottom:none}.leaflet-bar a.leaflet-disabled{opacity:.4;cursor:default}
.leaflet-attribution-flag{display:inline!important;vertical-align:baseline!important;width:1em;height:.6669em}
.leaflet-container .leaflet-control-attribution{background:color-mix(in srgb,var(--panel) 85%,transparent);margin:0;font:10px var(--body);padding:1px 5px;color:var(--muted)}
.leaflet-popup{position:absolute;text-align:center;margin-bottom:22px}

.leaflet-popup-tip-container{width:40px;height:20px;position:absolute;left:50%;margin-top:-1px;margin-left:-20px;overflow:hidden;pointer-events:none}
.leaflet-popup-tip{width:17px;height:17px;padding:1px;margin:-10px auto 0;pointer-events:auto;transform:rotate(45deg)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--fg);box-shadow:0 3px 14px rgba(0,0,0,.35)}
.leaflet-container a.leaflet-popup-close-button{position:absolute;top:0;right:0;border:none;text-align:center;width:28px;height:28px;font:18px/28px var(--body);color:var(--muted);text-decoration:none;background:transparent}
.leaflet-fade-anim .leaflet-popup{opacity:0;transition:opacity .2s linear}.leaflet-fade-anim .leaflet-map-pane .leaflet-popup{opacity:1}
.leaflet-touch .leaflet-bar{border:2px solid rgba(0,0,0,.15);background-clip:padding-box}
/* app map */
.mapwrap{position:relative;height:330px;transition:height .25s ease}.mapwrap.big{height:min(72vh,640px)}
#lmap{position:absolute;inset:0;z-index:0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .leaflet-tile-pane{filter:brightness(.82) saturate(.9)}}
:root[data-theme="dark"] .leaflet-tile-pane{filter:brightness(.82) saturate(.9)}
.pin{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font:500 12px/26px var(--mono);text-align:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pin.cur{background:var(--now)}.pin.done{background:var(--muted)}
.spin{line-height:0;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.45))}
.lp b{display:block;font-size:14px;margin-bottom:2px}.lp .m{font-family:var(--mono);font-size:11px;color:var(--muted)}.lp .a{display:flex;gap:6px;margin-top:8px}.lp .a a{padding:5px 9px;border-radius:9px;border:1px solid var(--line);text-decoration:none;font-size:12.5px;color:var(--ink)}.lp .a a.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.me{width:18px;height:18px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 2px rgba(26,115,232,.35),0 1px 4px rgba(0,0,0,.4)}
.btn.loc.on{background:#1a73e8;color:#fff;border-color:#1a73e8}
.offrow{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap}.btn.ghost{opacity:.75}
